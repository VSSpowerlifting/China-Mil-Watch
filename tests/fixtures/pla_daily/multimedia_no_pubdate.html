                                                <!-- 新闻类型 -->
                          <p tag="ueditor-text-p_display" class="ueditor-text-p_display" style="">中国海警局新闻发言人姜略表示，9月18日，中国海警三洲澳艇依法在中国南沙群岛仙宾礁附近海域开展维权执法行动。菲3015号船无视中方多次严正警告，故意调整航向，突然加速斜插我海警艇船艏，导致发生擦碰。菲方行径严重违反国际法和国际关系基本准则，威胁中国海警船艇、人员安全。中国海警艇操作专业规范、合理合法，有关责任完全在菲方。我们正告菲方，立即停止一切侵权挑衅行径，否则由此引发的一切后果由菲方承担。中国海警将继续在中方管辖海域开展维权执法行动，维护国家领土主权和海洋权益。</p>

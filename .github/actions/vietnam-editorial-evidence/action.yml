name: "Prepare verified Vietnam MPS research evidence"
description: "Read-only official shadow Git-state review and ephemeral Vietnam-to-Sunday thematic Briefs packet; does not send email or approve sources"
inputs:
  week-ending:
    description: "Exact reporting Saturday, YYYY-MM-DD"
    required: true
  notes:
    description: "Source-version-bound Vietnam notes path; absence requires an explicit missing-notes policy"
    required: false
    default: ""
  missing-notes-policy:
    description: "refuse (default) or continue-without-vietnam; malformed existing notes always refuse"
    required: false
    default: "refuse"
  require-vietnam:
    description: "true for a strict no-send preview requiring at least one current Vietnam research source"
    required: false
    default: "false"
  existing-packet:
    description: "Optional existing regional packet with Japan and other non-Vietnam sources"
    required: false
    default: ""
  state-commit:
    description: "Optional exact historic MPS shadow commit for reproducible testing; otherwise newest branch head"
    required: false
    default: ""
outputs:
  packet:
    description: "Absolute path to validated private combined official-source research JSON; never upload as a public artifact"
    value: ${{ steps.prepare.outputs.packet }}
  source-commit:
    description: "Exact verified Vietnam MPS shadow Git commit"
    value: ${{ steps.prepare.outputs.state_commit }}
  vietnam-count:
    description: "Number of Vietnam MPS research candidates admitted to private model evidence"
    value: ${{ steps.prepare.outputs.vietnam_count }}
  vietnam-readiness-status:
    description: "ready / missing-notes-with-eligible-archives / missing-notes-no-eligible-archives / no-version-matched-notes / no-eligible-observed-publications"
    value: ${{ steps.prepare.outputs.vietnam_status }}
  notes-catalog-missing:
    description: "true when optional Vietnam notes did not exist"
    value: ${{ steps.prepare.outputs.notes_missing }}
runs:
  using: composite
  steps:
    - id: prepare
      name: "Audit Vietnam isolated MPS state and stage a private Sunday evidence packet"
      shell: bash
      env:
        VN_WEEK_END: ${{ inputs.week-ending }}
        VN_NOTES: ${{ inputs.notes }}
        VN_MISSING_POLICY: ${{ inputs.missing-notes-policy }}
        VN_REQUIRE_VIETNAM: ${{ inputs.require-vietnam }}
        VN_EXISTING: ${{ inputs.existing-packet }}
        VN_PINNED_COMMIT: ${{ inputs.state-commit }}
      run: |
        set -euo pipefail
        # Inputs are environment values, never interpolated into shell syntax.
        [[ "$VN_WEEK_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
        [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
        test -n "$RUNNER_TEMP"
        [[ "$VN_MISSING_POLICY" == "refuse" || "$VN_MISSING_POLICY" == "continue-without-vietnam" ]] || {
          echo "::error::Missing-notes policy must be refuse or continue-without-vietnam"
          exit 1
        }
        [[ "$VN_REQUIRE_VIETNAM" == "true" || "$VN_REQUIRE_VIETNAM" == "false" ]] || {
          echo "::error::Require-Vietnam policy must be true or false"
          exit 1
        }
        if [[ -z "$VN_NOTES" || ! -e "$VN_NOTES" ]]; then
          if [[ "$VN_MISSING_POLICY" != "continue-without-vietnam" ]]; then
            echo "::error::No version-bound Vietnam notes; strict source-preparation preflight refused"
            exit 1
          fi
          echo "::warning::Vietnam source notes absent; versioned MPS evidence will be audited but not added to this model input. Do not infer ministry silence."
        fi
        working="$(mktemp -d "$RUNNER_TEMP/ipr-vietnam-shadow-XXXXXXXX")"
        state="$working/mps"
        # Official isolated branch only. Public read-only Git HTTPS; do not
        # grant the shadow clone a push credential or merge it into main.
        git clone --quiet --branch shadow/vietnam-mps-foreign-affairs           --single-branch "https://github.com/$GITHUB_REPOSITORY.git" "$state"
        test "$(git -C "$state" branch --show-current)" = "shadow/vietnam-mps-foreign-affairs"
        test "$(git -C "$state" ls-tree --name-only HEAD)" = "state"
        test -z "$(git -C "$state" status --porcelain)"
        # A pinned historical commit is permissible for a no-send replay
        # only when the independent verifier proves its ancestry on this
        # exact orphan source branch; production defaults to the current tip.
        state_sha="${VN_PINNED_COMMIT:-$(git -C "$state" rev-parse HEAD)}"
        [[ "$state_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
        mkdir "$working/editorial"
        destination="$working/editorial/$VN_WEEK_END.json"
        args=(--state-repo "$state"
          --state-commit "$state_sha"
          --notes "$VN_NOTES"
          --week-ending "$VN_WEEK_END"
          --out "$destination")
        if [[ "$VN_MISSING_POLICY" == "continue-without-vietnam" ]]; then
          args+=(--allow-missing-notes)
        fi
        if [[ "$VN_REQUIRE_VIETNAM" == "true" ]]; then
          args+=(--require-vietnam)
        fi
        if [[ -n "$VN_EXISTING" ]]; then
          test -f "$VN_EXISTING" || {
            echo "::error::The existing Japan/regional research packet is missing"
            exit 1
          }
          args+=(--existing "$VN_EXISTING")
        fi
        python -m scripts.build_vietnam_sunday_packet "${args[@]}" > "$working/result.json"
        test -s "$destination"
        # Count and classification only; no external source text/synopsis logs.
        cat "$working/result.json"
        # Expose only file path and counts; source notes stay on runner.
        vietnam_count="$(python -c 'import json,sys; data=json.load(open(sys.argv[1])); print(sum(x["desk"]=="vietnam" for x in data["items"]))' "$destination")"
        vietnam_status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["vietnam_readiness_status"])' "$working/result.json")"
        notes_missing="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["notes_catalog_missing"]).lower())' "$working/result.json")"
        {
          echo "packet=$destination"
          echo "state_commit=$state_sha"
          echo "vietnam_count=$vietnam_count"
          echo "vietnam_status=$vietnam_status"
          echo "notes_missing=$notes_missing"
        } >> "$GITHUB_OUTPUT"

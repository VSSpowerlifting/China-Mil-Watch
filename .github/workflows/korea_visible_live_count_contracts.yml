name: Korea — visible live metadata count

on:
  pull_request:
    paths:
      - site/preview/generate_preview.py
      - site/preview/templates/desk.html
      - tests/test_korea_visible_production_index.py
      - .github/workflows/korea_verified_official_link_production.yml
      - .github/workflows/korea_visible_live_count_contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-korea-live-index:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt
      - name: Render actual production Korea index and assert admitted count/dedup
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest \
            tests.test_korea_visible_production_index \
            tests.test_korea_official_index \
            tests.test_korea_official_metadata_auto_admission -v
      - name: No published output or production database mutations
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ shadow/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/ shadow/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

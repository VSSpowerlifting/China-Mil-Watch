name: Seven-day Daily Actions read-only export contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/capture_daily_actions_window.py'
      - 'tests/test_capture_daily_actions_window.py'
      - 'docs/DAILY_ACTIONS_WINDOW_CAPTURE.md'
      - '.github/workflows/daily_actions_window_contracts.yml'

permissions:
  contents: read

jobs:
  offline-window:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Record tracked archive SHA256
        id: base
        run: |
          echo "db=$(sha256sum pla_watch.db | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Verify conservative bounded seven-day export
        run: |
          python -m unittest tests.test_capture_daily_actions_window -v
          python -m unittest tests.test_capture_daily_actions_receipts -v
          python -m unittest tests.test_daily_run_receipts -v
      - name: Verify archive and published output unchanged
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: |
          test "$(sha256sum pla_watch.db | cut -d' ' -f1)" = "${{ steps.base.outputs.db }}"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

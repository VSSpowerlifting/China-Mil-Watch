name: Mixed regional private manuscript review - offline only

on:
  pull_request:
    branches:
      - main
      - feat/regional-mixed-owner-theme-choice-20261009
    paths:
      - core/regional_mixed_manuscript_review.py
      - tests/test_regional_mixed_manuscript_review.py
      - docs/REGIONAL_MIXED_PRIVATE_MANUSCRIPT_REVIEW.md
      - .github/workflows/regional_mixed_manuscript_review_checks.yml

permissions:
  contents: read

jobs:
  offline-private-manuscript-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Record database baseline
        run: sha256sum pla_watch.db > "$RUNNER_TEMP/mixed-manuscript-db.sha"
      - name: Install existing project requirements
        run: python -m pip install -r requirements.txt
      - name: Cross-desk citation, owner-focus and no-send regression tests
        run: |
          python -m unittest -v \
            tests.test_regional_mixed_manuscript_review \
            tests.test_regional_mixed_theme_choice \
            tests.test_regional_mixed_theme_selector \
            tests.test_regional_reviewed_typed_slate \
            tests.test_regional_sunday_theme_handoff \
            tests.test_weekly_briefs_auto_writer
      - name: Enforce no provider, email or public publishing integration
        run: |
          python - <<'PY'
          from pathlib import Path
          body = Path("core/regional_mixed_manuscript_review.py").read_text()
          workflow = Path(
              ".github/workflows/regional_mixed_manuscript_review_checks.yml"
          ).read_text()
          for bad in ("smtplib", "ANTHROPIC_API_KEY", "OPENAI_API_KEY",
                      "Anthropic(", "OpenAI(", "requests.post(",
                      "urllib.request", "send_packet(", "subprocess.",
                      "Path.write_text(", "Path.write_bytes("):
              assert bad not in body, bad
          for good in ("verify_owner_mixed_theme_choice",
                       "validate_manuscript", "publication_authorized",
                       "actually_cited_source_ids", "selected_but_not_cited_ids"):
              assert good in body, good
          assert ("  " + "schedule:") not in workflow
          assert "upload" + "-artifact" not in workflow
          PY
      - name: Confirm stored archive and published output unchanged
        if: always()
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/mixed-manuscript-db.sha"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

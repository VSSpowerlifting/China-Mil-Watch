name: Treasury Official Metadata — Isolated SQLite Admission Contract

on:
  pull_request:
    paths:
      - core/us_treasury_official_metadata.py
      - scripts/admit_us_treasury_official_metadata.py
      - tests/test_us_treasury_official_metadata_admission.py
      - .github/workflows/us_treasury_official_metadata_contract.yml
permissions:
  contents: read

jobs:
  source-free-typed-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements.txt
      - name: Strict identity/date/issuer and idempotent admission
        run: python -m unittest tests.test_us_treasury_official_metadata_admission -v
      - name: Rehearse actual preserved Treasury daily receipts into scratch SQLite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > "$RUNNER_TEMP/treasury-db-before.sha"
          cp pla_watch.db "$RUNNER_TEMP/treasury-admission-rehearsal.sqlite"
          git clone --quiet --single-branch --branch shadow/us-treasury-press \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            "$RUNNER_TEMP/treasury-source"
          git -C "$RUNNER_TEMP/treasury-source" rev-parse HEAD > "$RUNNER_TEMP/treasury-source.sha"
          python -m scripts.admit_us_treasury_official_metadata \
            --source-checkout "$RUNNER_TEMP/treasury-source" \
            --production-db "$RUNNER_TEMP/treasury-admission-rehearsal.sqlite" \
            --standing-official-links-approval
          python -m scripts.admit_us_treasury_official_metadata \
            --source-checkout "$RUNNER_TEMP/treasury-source" \
            --production-db "$RUNNER_TEMP/treasury-admission-rehearsal.sqlite" \
            --standing-official-links-approval
          python - <<'PY'
          from pathlib import Path
          import os, sqlite3
          from core.us_treasury_official_metadata import load_public_links
          db=Path(os.environ["RUNNER_TEMP"])/"treasury-admission-rehearsal.sqlite"
          links=load_public_links(db)
          assert len(links)==10
          assert all(x["source_identity"].startswith("us-treasury-press:") for x in links)
          assert all(x["source_url"].startswith("https://home.treasury.gov/news/press-releases/sb") for x in links)
          with sqlite3.connect(db) as con:
              assert con.execute("PRAGMA quick_check").fetchone()[0]=="ok"
              assert con.execute("SELECT COUNT(*) FROM treasury_official_observations").fetchone()[0]>=1
          print("Real Treasury observed links admitted to scratch:",len(links))
          PY
          test "$(git -C "$RUNNER_TEMP/treasury-source" rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/treasury-source.sha")"
          sha256sum -c "$RUNNER_TEMP/treasury-db-before.sha"
      - name: No production corpus or Pages edits
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code -- pla_watch.db output/ desks/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

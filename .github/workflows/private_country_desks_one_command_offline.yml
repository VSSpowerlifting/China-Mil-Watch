name: Private Philippines Vietnam and Korea desks — one-command functional QA

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/launch_private_country_desks.py"
      - "tests/test_launch_private_country_desks.py"
      - "docs/engineering/PRIVATE_COUNTRY_DESK_ONE_COMMAND_2026-10-11.md"
      - "docs/engineering/KOREA_PRIVATE_RESEARCH_READER_2026-10-11.md"
      - ".github/workflows/private_country_desks_one_command_offline.yml"

permissions:
  contents: read

jobs:
  local-only-six-source-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Source snapshots and private browser from six synthetic Git branches
        run: |
          python -m unittest tests.test_private_country_desk_reader -v
          python -m unittest tests.test_launch_private_country_desks -v
      - name: No network, production corpus or shadow state changed by QA
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ shadow/ desks/registry.json
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/ shadow/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

name: Korea current publisher text-use policy observation

on:
  pull_request:
    paths:
      - core/korea_current_policy_replay.py
      - scripts/audit_korea_current_policy.py
      - tests/test_korea_current_policy_replay.py
      - .github/workflows/korea_current_policy_replay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install beautifulsoup4 requests
      - name: Validate official site, terms, clock, redirects and exclusions
        run: python -m unittest -v tests.test_korea_current_policy_replay
      - name: Prove public DB and output unmodified
        run: |
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
  observed-live-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install beautifulsoup4 requests
      - name: Fetch official current Korea publisher and KOGL Type 1 terms
        run: python -m scripts.audit_korea_current_policy
      - name: Prove no public records or original source bodies changed
        run: |
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"

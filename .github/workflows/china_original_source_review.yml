name: China original-source research receipt contracts

# Validates private, preliminary desk research only; no publisher requests,
# LLM, generated output, database reads, external artifact upload or release.
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/audit_china_original_source_notes.py
      - tests/test_china_original_source_notes.py
      - scripts/audit_china_legacy_capture_quality.py
      - tests/test_china_legacy_capture_quality.py
      - research/china/original-source-review-2026-10-15.json
      - docs/CHINA_ORIGINAL_SOURCE_RESEARCH_2026-10-15.md
      - .github/workflows/china_original_source_review.yml

permissions:
  contents: read

concurrency:
  group: china-original-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence-receipts-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Protect tracked corpus and output
        shell: bash
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > "$RUNNER_TEMP/china-source-db.sha"
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Test source-review receipts and unsafe cases
        run: python -m unittest -v tests.test_china_original_source_notes tests.test_china_legacy_capture_quality
      - name: Validate real seven-source checkpoint packet
        run: |
          python scripts/audit_china_original_source_notes.py \
            --packet research/china/original-source-review-2026-10-15.json \
            --index output/corpus-index.json \
            --records-dir output/record
      - name: Survey older Global Times captures for possible teaser contamination
        run: |
          python scripts/audit_china_legacy_capture_quality.py \
            --index output/corpus-index.json \
            --records-dir output/record
      - name: Confirm archive untouched
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/china-source-db.sha"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

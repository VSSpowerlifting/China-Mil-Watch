name: China original-source research receipt contracts

# Validates historical source-review algorithms with synthetic fixtures and
# read-only post-cull public retirement invariants. The October 15 research
# packet remains a preliminary historical note; referenced original record
# pages were intentionally de-published. No publisher requests, model use,
# generated output, artifact upload or release.
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/audit_china_original_source_notes.py
      - tests/test_china_original_source_notes.py
      - scripts/audit_china_legacy_capture_quality.py
      - tests/test_china_legacy_capture_quality.py
      - research/china/original-source-review-2026-10-15.json
      - docs/CHINA_ORIGINAL_SOURCE_RESEARCH_2026-10-15.md
      - .github/workflows/china_original_source_review.yml

permissions:
  contents: read

concurrency:
  group: china-original-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence-receipts-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Protect tracked corpus and output
        shell: bash
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > "$RUNNER_TEMP/china-source-db.sha"
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Test source-review receipts and unsafe cases
        run: python -m unittest -v tests.test_china_original_source_notes tests.test_china_legacy_capture_quality
      # The approved 2026-10-16 China cutover deliberately removed 4,400
      # public original record bodies, not the preliminary historical packet.
      # Re-running a source-body audit against absent pages is impossible, not a test of
      # current public safety. Synthetic audit/cue regressions above remain.
      # Fail closed unless the exact approved retirement is still intact.
      # Surviving curated China records retain their original-body fidelity
      # checks; retirement checks cannot imply they were all deleted.
      - name: Verify private-history/public-retirement boundary
        run: |
          set -euo pipefail
          test -s research/china/original-source-review-2026-10-15.json
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.reconcile_db import read_only
          from core.retired_article_urls import verify_no_active_retired_urls

          packet = json.loads(Path(
              "research/china/original-source-review-2026-10-15.json").read_text())
          if (packet.get("publication_enabled") is not False or
                  packet.get("owner_approved") is not False or
                  packet.get("purpose") != "assistant_research_preliminary_not_editorial_signoff"):
              raise SystemExit("historical research packet claims publishing authority")
          checks = packet.get("checks")
          if not isinstance(checks, list) or not checks:
              raise SystemExit("empty or invalid preliminary research packet")
          packet_ids = [item["id"] for item in checks]
          if len(packet_ids) != len(set(packet_ids)):
              raise SystemExit("duplicate historical source-review ID")
          from scripts.audit_china_original_source_notes import (
              OriginalBodyParser, _original_record, _original_url,
          )

          with read_only("pla_watch.db") as con:
              if verify_no_active_retired_urls(con) != 4400:
                  raise SystemExit("expected exact owner-approved 4,400 China retirements")
              retired_ids = {row[0] for row in con.execute(
                  "SELECT original_article_id FROM retired_article_urls")}
              live_ids = {row[0] for row in con.execute("SELECT id FROM articles")}
          index = json.loads(Path("output/corpus-index.json").read_text())
          source_by_id = {row[0]: row for row in index["records"]}
          held = kept = 0
          for case in checks:
              ident = case["id"]
              page = Path("output/record") / ("%d.html" % ident)
              stub = Path("output/article") / ("%d.html" % ident)
              if ident in retired_ids:
                  if ident in live_ids or page.exists() or stub.exists():
                      raise SystemExit("retired source unexpectedly public: %d" % ident)
                  held += 1
                  continue
              if ident not in live_ids or not page.is_file():
                  raise SystemExit("historical research case lost its live/retired identity: %d" % ident)
              row = source_by_id.get(ident)
              if row is None or row[1] != case["published_date"]:
                  raise SystemExit("surviving historical case date/index drift: %d" % ident)
              source = index["sources"][row[2]]
              if (source["code"] != case["source"] or
                      (row[5] or row[4]) != case["title"]):
                  raise SystemExit("surviving historical case source/title drift: %d" % ident)
              html = page.read_text(encoding="utf-8")
              if case["comparison"] == "historical_body_absent":
                  parser = OriginalBodyParser()
                  parser.feed(html)
                  if parser.hits or parser.depth:
                      raise SystemExit("historical absent-body case changed: %d" % ident)
                  stored_url = _original_url(html)
              else:
                  body, stored_url = _original_record(html)
                  if case["stored_body_anchor"] not in body:
                      raise SystemExit("surviving stored-body anchor changed: %d" % ident)
              if stored_url != case["captured_url"]:
                  raise SystemExit("surviving source URL drift: %d" % ident)
              kept += 1
          if held + kept != len(packet_ids):
              raise SystemExit("historical review case accounting mismatch")
          print("%d preliminary source notes: %d retired/held, %d still live and source-checked; no publication authority" % (
              len(packet_ids), held, kept))
          PY
      - name: Confirm archive untouched
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/china-source-db.sha"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

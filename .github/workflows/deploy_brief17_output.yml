name: Deploy Brief 17 Rendered Output

on:
  push:
    branches:
      - ops/deploy-brief17-output

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact merged main
        uses: actions/checkout@v4
        with:
          ref: 41100d91d5e0ccdf126bd6d5ced5d8b4acf373e6
          fetch-depth: 0

      - name: Guard exact publication source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "41100d91d5e0ccdf126bd6d5ced5d8b4acf373e6"
          test "$(git rev-parse origin/main)" = "41100d91d5e0ccdf126bd6d5ced5d8b4acf373e6"

      - name: Cancel stale Daily runs before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs"
          for run_id in 37671050416 37678868237; do
            status="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}/${run_id}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            echo "run ${run_id}: ${status}"
            case "${status}" in
              queued|in_progress|pending|requested|waiting)
                code="$(curl -sS -o "/tmp/cancel-${run_id}.json" -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}/${run_id}/cancel")"
                if [ "${code}" != "202" ] && [ "${code}" != "409" ]; then
                  cat "/tmp/cancel-${run_id}.json"
                  echo "::error::Could not cancel Daily run ${run_id}; HTTP ${code}"
                  exit 1
                fi
                ;;
            esac
          done

      - name: Verify stale Daily runs cannot deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs"
          for attempt in $(seq 1 20); do
            unsafe=0
            for run_id in 37671050416 37678868237; do
              status="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}/${run_id}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["status"]+" "+str(d.get("conclusion")))' )"
              echo "run ${run_id}: ${status}"
              case "${status}" in
                completed*) ;;
                *) unsafe=1 ;;
              esac
            done
            if [ "${unsafe}" = "0" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::A stale Daily run is still capable of reaching deployment"
          exit 1

      - name: Verify Brief No. 17 rendered output
        run: |
          set -euo pipefail
          test -d output
          test -n "$(ls -A output)"
          PAGE="output/briefs/trident-resolve-regional-scale-specific-chinese-tasks.html"
          test -f "$PAGE"
          grep -Fq "Trident Resolve: What the Exercise Looked Like From Singapore and China" "$PAGE"
          grep -Fq "No. 17" "$PAGE"
          grep -Fq 'href="#r-4392"' "$PAGE"
          grep -Fq 'href="#r-4935"' "$PAGE"
          grep -Fq "Trident Resolve: What the Exercise Looked Like From Singapore and China" output/analysis.html
          grep -Fq "Trident Resolve: What the Exercise Looked Like From Singapore and China" output/briefs/feed.xml
          grep -Fq "trident-resolve-regional-scale-specific-chinese-tasks" output/sitemap.xml

      - name: Validate rendered output
        run: python3 scripts/validate_output.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          cname: indopacificrecord.org
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy Brief No. 17 (output-only): ${{ github.run_id }}'

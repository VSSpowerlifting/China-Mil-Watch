name: AFP and Kemhan — Pinned Held Metadata Intake

# Not a source-family activation. Run real existing shadow Git through the
# read-only private reader; emit only counts/digests, with every row HELD.
on:
  pull_request:
    paths:
      - core/crossdesk_official_metadata_candidates.py
      - scripts/stage_afp_kemhan_official_links.py
      - tests/test_afp_kemhan_official_link_intake.py
      - .github/workflows/afp_kemhan_held_metadata_intake.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fictional-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest tests.test_afp_kemhan_official_link_intake -v
      - run: |
          git diff --exit-code -- pla_watch.db output/ shadow/ 
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

  existing-real-originals-count-only:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Fetch existing unmodified shadow source Git branches to transient runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          git clone --single-branch --branch shadow/ph-afp \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$RUNNER_TEMP/ipr-afp-readonly"
          git clone --single-branch --branch shadow/indonesia-kemhan \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$RUNNER_TEMP/ipr-kemhan-readonly"
          git -C "$RUNNER_TEMP/ipr-afp-readonly" fsck --no-reflogs --connectivity-only
          git -C "$RUNNER_TEMP/ipr-kemhan-readonly" fsck --no-reflogs --connectivity-only
          # Use the exact owner-reviewed historic cohorts, not newly advanced
          # branch tips. Each old commit must still be an ancestor of the
          # collector branch; a force-push or history loss is a HOLD.
          afp=8a63ba423818e30d147096fd1a32949cf6905ee5
          kemhan=0595c6677be24f8f0f33aecb28eec0050e36e8f9
          git -C "$RUNNER_TEMP/ipr-afp-readonly" cat-file -e "$afp^{commit}"
          git -C "$RUNNER_TEMP/ipr-kemhan-readonly" cat-file -e "$kemhan^{commit}"
          git -C "$RUNNER_TEMP/ipr-afp-readonly" merge-base --is-ancestor "$afp" HEAD
          git -C "$RUNNER_TEMP/ipr-kemhan-readonly" merge-base --is-ancestor "$kemhan" HEAD
          test "$(git -C "$RUNNER_TEMP/ipr-afp-readonly" ls-tree --name-only "$afp")" = state
          test "$(git -C "$RUNNER_TEMP/ipr-kemhan-readonly" ls-tree --name-only "$kemhan")" = state
      - name: Reverify actual pinned shadow source snapshots; produce count-only held receipts
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > "$RUNNER_TEMP/db-start.sha"
          python -m scripts.stage_afp_kemhan_official_links \
            --family ph_afp_articles \
            --source-checkout "$RUNNER_TEMP/ipr-afp-readonly" \
            --source-commit "8a63ba423818e30d147096fd1a32949cf6905ee5" \
            --count-only
          python -m scripts.stage_afp_kemhan_official_links \
            --family id_kemhan_news \
            --source-checkout "$RUNNER_TEMP/ipr-kemhan-readonly" \
            --source-commit "0595c6677be24f8f0f33aecb28eec0050e36e8f9" \
            --count-only
          sha256sum -c "$RUNNER_TEMP/db-start.sha"
          git diff --exit-code -- pla_watch.db output/ shadow/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

# No writes to main, Pages, source branches, production DB, or publisher.
# This does not approve fresh collection, link reuse, original text, or analysis.

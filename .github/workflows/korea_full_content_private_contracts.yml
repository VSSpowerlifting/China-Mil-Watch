name: Korea full-content private rehearsal — source and draft contracts

on:
  pull_request:
    paths:
      - core/korea_full_content_rehearsal.py
      - scripts/rehearse_korea_full_content.py
      - tests/test_korea_full_content_rehearsal.py
      - .github/workflows/korea_full_content_private_contracts.yml

permissions:
  contents: read

jobs:
  private-source-content-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install existing Korean shadow parser dependencies
        run: python -m pip install beautifulsoup4 requests
      - name: Compile private-only content modules
        run: |
          python -m py_compile core/korea_full_content_rehearsal.py scripts/rehearse_korea_full_content.py
      - name: Check exact capture, rights observations, machine translation and source notes
        run: python -m unittest -v tests.test_korea_full_content_rehearsal
      - name: Prove production content and site not mutated
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

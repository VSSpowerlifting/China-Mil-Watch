name: BIS — Authenticated Metadata Admission Contracts (Held)

on:
  pull_request:
    paths:
      - core/us_bis_authenticated_metadata.py
      - scripts/admit_us_bis_scheduled_metadata.py
      - tests/test_us_bis_authenticated_metadata.py
      - .github/workflows/us_bis_authenticated_metadata_contract.yml
      - docs/engineering/US_BIS_AUTHENTICATED_ADMISSION_2026-10-15.md

permissions:
  contents: read

jobs:
  source-free-authenticated-sqlite-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements.txt
      - name: Attestation bound typed SQLite, rollback and negative source tests
        run: |
          python -m unittest \
            tests.test_us_bis_authenticated_metadata \
            tests.test_us_bis_scheduled_receipt_attestation \
            tests.test_us_bis_homepage_receipt -v
      - name: No production write, page change or source Git admission
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code -- pla_watch.db output/ site/ desks/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

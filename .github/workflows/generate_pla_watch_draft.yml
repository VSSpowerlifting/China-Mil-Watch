name: Generate PLA Watch Draft

# Manual-only. Generates a weekly PLA Watch edition and uploads the output
# as a downloadable artifact for review. Does NOT commit to main, does NOT
# deploy to gh-pages, does NOT publish anything live.

on:
  workflow_dispatch:
    inputs:
      week_ending:
        description: 'Week ending date (YYYY-MM-DD). Editions close on Saturday; leave blank for the upcoming Saturday.'
        required: false
        type: string
      retrospective:
        description: 'Prepared after its week rather than during it. Records publication_timing=retrospective, renders a visible label, and uses the deterministic gradient cover instead of fetching a source image.'
        required: false
        type: boolean
        default: false

concurrency:
  group: pla-watch-draft
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate PLA Watch draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Through the environment, never interpolated into the script body.
          WEEK_ENDING: ${{ inputs.week_ending }}
          RETROSPECTIVE: ${{ inputs.retrospective }}
        run: |
          set -euo pipefail
          # Build arguments only when actually selected: an empty input must not
          # reach argparse as --week-ending "", and --retrospective must be
          # absent unless the operator ticked it.
          set --
          if [ -n "${WEEK_ENDING:-}" ]; then
            set -- "$@" --week-ending "${WEEK_ENDING}"
          fi
          if [ "${RETROSPECTIVE:-false}" = "true" ]; then
            set -- "$@" --retrospective
          fi
          python scripts/generate_pla_watch.py "$@"

      - name: Upload draft artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pla-watch-draft-${{ github.run_id }}
          path: |
            output/the-pla-watch/
            the-pla-watch/linkedin/
          if-no-files-found: warn
          retention-days: 14

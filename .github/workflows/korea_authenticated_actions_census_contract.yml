name: Korea authenticated Actions census — offline contract

on:
  pull_request:
    paths:
      - scripts/run_korea_authenticated_actions_census.py
      - tests/test_korea_authenticated_actions_census.py
      - .github/workflows/korea_authenticated_actions_census_contract.yml
      - .github/workflows/korea_authenticated_actions_census.yml

permissions:
  contents: read

jobs:
  authenticated-census-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Synthetic GitHub pagination and authenticated census checks only
        run: python -m unittest tests.test_korea_authenticated_actions_census -v
      - name: Never mutate protected corpus or generated public pages
        run: |
          git diff --exit-code -- pla_watch.db output/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

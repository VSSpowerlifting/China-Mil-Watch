name: Daily PLA Watch Update

on:
  schedule:
    # Five retry windows. NOMINALLY 08:23–10:23 NY (EDT, UTC-4) — but measured
    # start times run 60–100 min late, every window, so real execution is closer
    # to 09:45–11:30 NY. Aug 1 and Aug 2 2026 both show the same pattern (cron
    # 12:23 UTC -> actual 14:04 and 14:02). The off-peak :23/:53 minutes do NOT
    # appear to buy anything; they are kept only because changing them has not
    # been tested. Do not rely on these times when timing a manual push — check
    # the Actions API for what is actually running:
    #   curl -s .../actions/runs?per_page=5
    # The scheduling guard ensures at most one successful run per NY calendar day.
    # NOTE: a run whose guard says should_run=false skips every step and still
    # reports "success", so a green run does NOT mean the pipeline executed.
    - cron: '23 12 * * *'
    - cron: '53 12 * * *'
    - cron: '23 13 * * *'
    - cron: '53 13 * * *'
    - cron: '23 14 * * *'
  workflow_dispatch:         # Manual trigger from Actions tab

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      # ref: main ensures a queued run (serialized by concurrency group)
      # checks out the tip of main at job-start time, not the trigger SHA.
      # This way a second queued run sees the state file written by the first.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0        # Full history needed for the push-back step

      # ── 2. Scheduling guard ────────────────────────────────────────────────
      # Manual dispatch: always run.
      # Scheduled: run once per NY calendar day (tracked in last_daily_run_date.txt).
      # No time-of-day window — late cron fires still update the site.
      - name: Scheduling guard
        id: timecheck
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          STATE_FILE         = ".github/state/last_daily_run_date.txt"
          FAILURE_FILE       = ".github/state/last_billing_failure_date.txt"
          event     = os.environ.get("GITHUB_EVENT_NAME", "")
          now       = datetime.now(ZoneInfo("America/New_York"))
          today_str = now.strftime("%Y-%m-%d")
          is_manual = event == "workflow_dispatch"

          def read_state(path):
              try:
                  with open(path) as f:
                      return f.read().strip()
              except FileNotFoundError:
                  return ""

          last_run     = read_state(STATE_FILE)
          last_failure = read_state(FAILURE_FILE)

          print(f"GitHub event:        {event}")
          print(f"New York time:       {now:%Y-%m-%d %H:%M:%S %Z}")
          print(f"Is manual dispatch:  {is_manual}")
          print(f"Last run date:       {last_run!r}")
          print(f"Last billing failure:{last_failure!r}")
          print(f"Today (NY):          {today_str}")

          if is_manual:
              should_run = "true"
              reason = "manual dispatch — skipping all guards"
          elif last_run == today_str:
              should_run = "false"
              reason = f"already ran successfully today ({today_str})"
          elif last_failure == today_str:
              should_run = "false"
              reason = (
                  f"billing/API failure already recorded today ({today_str}); "
                  "use workflow_dispatch to retry after fixing credits"
              )
          else:
              should_run = "true"
              reason = f"today ({today_str}) has not yet run"

          print(f"Decision:            should_run={should_run}")
          print(f"Reason:              {reason}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={should_run}\n")
              f.write(f"today_ny={today_str}\n")
          PY

      # ── 3. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.9
        if: steps.timecheck.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      # ── 3b. Register the pla_watch.db merge driver ────────────────────────
      # `.gitattributes` names the driver but cannot define it, so an
      # unregistered runner silently falls back to a raw binary conflict. Every
      # push-back step below runs `git pull --rebase`, and CI is exactly where
      # an unattended conflict is most expensive: the rebase fails, the commit
      # step fails, and `failure()` then drives the persist step into the same
      # conflict — losing the day's collection (DECISION_LOG 2026-08-02).
      # reconcile_db.py imports only the standard library, so this is safe to
      # run before dependencies are installed.
      - name: Register DB merge driver
        if: steps.timecheck.outputs.should_run == 'true'
        run: python scripts/reconcile_db.py --install-driver

      # ── 4. Dependencies ────────────────────────────────────────────────────
      - name: Install dependencies
        if: steps.timecheck.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: steps.timecheck.outputs.should_run == 'true'
        run: playwright install chromium --with-deps

      # ── 4b. Apply and verify migrations BEFORE any collection ─────────────
      # pipeline.py's init_db() also applies migrations, but doing it here means
      # a migration failure stops the run before a single network request or
      # paid model call is made, and before anything can be committed. Both
      # steps carry implicit success(), so a failure skips the pipeline, the
      # commit steps and the deploy.
      - name: Apply database migrations
        if: steps.timecheck.outputs.should_run == 'true'
        run: python -m migrations.cli --apply

      - name: Verify database schema and invariants
        if: steps.timecheck.outputs.should_run == 'true'
        run: python scripts/verify_db_current.py

      # ── 4c. Offline test suite ────────────────────────────────────────────
      # No network, no model calls, temporary databases only — the suite never
      # touches the tracked pla_watch.db. Runs before collection so a broken
      # build cannot scrape, spend, commit or deploy.
      - name: Run offline test suite
        if: steps.timecheck.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -t . -v

      # Re-run just the reconciliation contract separately. Redundant with the
      # suite above by design: when this fails, the failure line names the
      # merge-driver contract rather than being one entry in a long list.
      - name: Reconciliation contract check
        if: steps.timecheck.outputs.should_run == 'true'
        run: python -m unittest tests.test_reconcile -v

      # The suite must not have dirtied the tracked database. If it did, the
      # commit step below would push test residue into production.
      - name: Assert tests left the tracked database clean
        if: steps.timecheck.outputs.should_run == 'true'
        run: |
          if ! git diff --quiet -- pla_watch.db; then
            echo "::error title=Test residue::The offline suite modified pla_watch.db. Tests must use temporary copies."
            git diff --stat -- pla_watch.db
            exit 1
          fi
          echo "Tracked database untouched by tests."

      # ── 5. Run pipeline (all sources) ─────────────────────────────────────
      - name: Run pipeline
        if: steps.timecheck.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py

      # ── 5b. Validate rendered output (blocks deploy on failure) ───────────
      # Runs after the pipeline generates the site. A non-zero exit skips the
      # commit, deploy, and success-marker steps below, so a broken render
      # never reaches production and a later run can retry.
      - name: Validate rendered output
        if: steps.timecheck.outputs.should_run == 'true'
        run: python scripts/validate_output.py

      # ── 6a. Persist scraped articles even when the pipeline failed ────────
      # Collection and analysis are SEPARATE stages: pipeline.py stores scraped
      # articles before it makes any LLM call, so an analysis or billing failure
      # still leaves that day's articles sitting in the runner's database. The
      # commit step below requires success(), so without this step the runner is
      # destroyed with those articles inside — which is exactly how 2026-07-17→24
      # was lost, and how 2026-07-30 would have been lost to a spend limit
      # (DECISION_LOG 2026-07-30).
      #
      # Commits pla_watch.db ONLY. output/ is deliberately excluded: the whole
      # point of gating the normal commit on success() is that a broken or stale
      # render must never reach production, and this step must not become a way
      # around that. Unanalyzed articles keep passed_relevance NULL, so they
      # re-enter the queue as backlog and drain via BACKLOG_RESERVE_FRACTION.
      - name: Persist scraped articles (if pipeline failed)
        if: >
          failure() &&
          steps.timecheck.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pla_watch.db
          if git diff --cached --quiet; then
            echo "No newly scraped articles to persist."
          else
            git commit -m "Persist collection: $(date -u +%Y-%m-%d) (analysis incomplete)"
            git pull --rebase --autostash origin main

            # Post-rebase verification. The rebase may have run the reconcile
            # merge driver, which now migrates its output before merging rows —
            # so this is ordinarily a no-op. It exists so that a regressed
            # database fails closed instead of reaching origin. This path
            # legitimately commits pla_watch.db, so a repair is permitted, but
            # only if it ends up inside the commit that gets pushed.
            python scripts/verify_db_current.py --repair
            if ! git diff --quiet -- pla_watch.db; then
              echo "::warning title=DB repaired::Post-rebase migration repaired pla_watch.db; amending the unpushed commit so the repair is pushed with it."
              git add pla_watch.db
              git commit --amend --no-edit
            fi
            # Proof of inclusion: the working tree must now equal HEAD, and HEAD
            # is what gets pushed. Then re-verify with no repair allowed.
            git diff --quiet HEAD -- pla_watch.db
            python scripts/verify_db_current.py

            git push origin main
          fi

      # ── 6b. Commit billing-failure marker (scheduled runs only) ──────────
      # Runs even when the pipeline step fails so the marker reaches origin/main
      # and the scheduling guard can block later cron windows the same day.
      # workflow_dispatch skips this so a manual retry is always allowed.
      #
      # always(), NOT failure() (fixed 2026-08-09). pipeline.py writes the marker
      # whenever the API reports an account block, including a PARTIAL block that
      # still analyzed some articles and exited 0. This step used to be gated on
      # failure(), and step 6 below only stages `pla_watch.db output/`, so on a
      # partial block the marker was written into the runner and then destroyed
      # with it. That is exactly what happened on 2026-08-07: credit ran out
      # after 24 of 36 articles, the run exited 0, no marker reached origin, and
      # the day was recorded as clean. The `git diff --cached --quiet` check
      # below makes this a no-op on days when pipeline.py did not rewrite it.
      - name: Commit billing-failure marker (if the account was blocked)
        if: >
          always() &&
          steps.timecheck.outputs.should_run == 'true' &&
          github.event_name != 'workflow_dispatch'
        run: |
          MARKER=".github/state/last_billing_failure_date.txt"
          if [ ! -f "$MARKER" ]; then
            echo "No billing-failure marker file found — skipping commit."
            exit 0
          fi
          # Check for a pipeline-written change BEFORE touching git remotes. This
          # step now runs on every scheduled run, and the rebase below stashes and
          # restores pla_watch.db through the reconciler merge driver — not work
          # worth doing on the majority of days when the marker is untouched.
          if git diff --quiet -- "$MARKER"; then
            echo "Marker unchanged — the account was not blocked this run."
            exit 0
          fi
          echo "::warning title=Billing block::pipeline.py recorded an account-level API block; committing the marker."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main

          # Marker-only path: verify, never repair. A repair here would put
          # database changes into a commit whose documented responsibility is a
          # single state file. If the rebase produced a regressed database, fail
          # closed and let the DB-committing path deal with it.
          python scripts/verify_db_current.py

          git add "$MARKER"
          # Guard the documented responsibility: nothing but the marker may be
          # staged on this path.
          STAGED=$(git diff --cached --name-only)
          if [ "$STAGED" != "$MARKER" ] && [ -n "$STAGED" ]; then
            echo "::error title=Scope violation::The billing-marker step staged more than the marker: $STAGED"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Billing-failure marker already committed."
          else
            git commit -m "State: billing failure ${{ steps.timecheck.outputs.today_ny }}"
            git push origin main
          fi

      # ── 6. Commit DB + site output back to main ───────────────────────────
      - name: Commit updated database and site output
        if: steps.timecheck.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pla_watch.db output/
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new articles today."
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main

            # Post-rebase verification, same contract as the persist path: the
            # reconciler's output should already be current, so this is normally
            # a no-op. This path commits pla_watch.db, so repair is permitted
            # and must be proven to be inside the pushed commit.
            python scripts/verify_db_current.py --repair
            if ! git diff --quiet -- pla_watch.db; then
              echo "::warning title=DB repaired::Post-rebase migration repaired pla_watch.db; amending the unpushed commit so the repair is pushed with it."
              git add pla_watch.db
              git commit --amend --no-edit
            fi
            git diff --quiet HEAD -- pla_watch.db
            python scripts/verify_db_current.py

            git push
          fi

      # ── 7. Deploy output/ to gh-pages ─────────────────────────────────────
      - name: Deploy to GitHub Pages
        if: steps.timecheck.outputs.should_run == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          cname: chinamilwatch.org
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy: ${{ github.run_id }}'

      # ── 8. Record successful run ───────────────────────────────────────────
      # Written here — after deploy — so a deploy failure does not mark today
      # as done. Steps run with implicit success() so this is skipped if any
      # earlier step failed. Both scheduled and manual runs write the state
      # file so a successful manual run prevents a duplicate scheduled run.
      - name: Record successful run
        if: steps.timecheck.outputs.should_run == 'true'
        env:
          TODAY_NY: ${{ steps.timecheck.outputs.today_ny }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main

          # Marker-only path: verify, never repair (see the billing-marker step).
          python scripts/verify_db_current.py

          mkdir -p .github/state
          echo "$TODAY_NY" > .github/state/last_daily_run_date.txt
          git add .github/state/last_daily_run_date.txt
          STAGED=$(git diff --cached --name-only)
          if [ "$STAGED" != ".github/state/last_daily_run_date.txt" ] && [ -n "$STAGED" ]; then
            echo "::error title=Scope violation::The success-marker step staged more than the state file: $STAGED"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "State file already up to date."
          else
            git commit -m "State: mark daily run ${TODAY_NY}"
            git push origin main
          fi

      # ── 9. Health gate — make silent degradation loud ─────────────────────
      # Added 2026-08-09. Everything above is designed to keep publishing when
      # part of the run fails, which is correct — but it also means a run can
      # go green while something is materially wrong. Two failures reached
      # production unnoticed that way: the 2026-08-07 credit exhaustion (green,
      # 12 articles unanalyzed) and MOD China going silent on 2026-07-10 (green
      # every day for four weeks).
      #
      # This step runs LAST, after publish and after the success marker, so it
      # never blocks a deploy that was otherwise fine. Its only job is to turn
      # the run red so GitHub's failure notification actually reaches a human.
      - name: Health gate
        if: steps.timecheck.outputs.should_run == 'true'
        env:
          TODAY_NY: ${{ steps.timecheck.outputs.today_ny }}
        run: |
          set -uo pipefail
          PROBLEMS=0

          # ── Billing: did pipeline.py record an account block today? ────────
          MARKER=".github/state/last_billing_failure_date.txt"
          if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$TODAY_NY" ]; then
            echo "::error title=API account blocked::The Anthropic account was blocked during today's run (${TODAY_NY}). Articles were collected but analysis is incomplete. Restore credit, then re-run this workflow manually — workflow_dispatch bypasses the marker guard."
            {
              echo "### ❌ API account blocked"
              echo
              echo "Collection succeeded; analysis is incomplete for ${TODAY_NY}."
              echo "Unanalyzed articles stay pending and drain via the backlog reserve."
            } >> "$GITHUB_STEP_SUMMARY"
            PROBLEMS=$((PROBLEMS + 1))
          fi

          # ── Sources: has any non-inert source gone quiet? ──────────────────
          # Writes its own annotations and step summary. Acknowledge a source
          # whose silence is understood by adding it to KNOWN_INERT in the
          # script, with the reason — that is a deliberate, reviewable act.
          if ! python scripts/check_source_liveness.py; then
            echo "::error title=Source silent::A source has stopped producing articles. Fix the scraper, or add it to KNOWN_INERT in scripts/check_source_liveness.py with a documented reason."
            PROBLEMS=$((PROBLEMS + 1))
          fi

          if [ "$PROBLEMS" -gt 0 ]; then
            echo "Health gate: ${PROBLEMS} problem(s). Today's output was published; this failure is a notification, not a publish failure."
            exit 1
          fi
          echo "Health gate: clean."

name: Temporary No.18 scoped render and integration QA
on:
  push:
    branches: [editorial/laos-no18-context-photo-20261013]
    paths: [.github/workflows/no18_render_stage.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project requirements
        run: pip install -r requirements.txt
      - name: Validate No.18 paired-cover image and current Briefs
        run: |
          set -euo pipefail
          python scripts/build_brief_cover.py --check
          python scripts/build_catalogue_media.py --check
          python -m unittest tests.test_catalogue_media tests.test_brief_cover tests.test_brief_photography tests.test_article_media tests.test_brief_source_linked -v
      - name: Render isolated publication snapshot (no Pages changes)
        run: |
          set -euo pipefail
          python site/render.py --out "$RUNNER_TEMP/no18-render"
          test -f "$RUNNER_TEMP/no18-render/analysis.html"
          test -f "$RUNNER_TEMP/no18-render/briefs/what-is-being-built-in-laos.html"
          python - "$RUNNER_TEMP/no18-render" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          analysis = (root/"analysis.html").read_text()
          article = (root/"briefs/what-is-being-built-in-laos.html").read_text()
          assert "Benjamin Yang and Dylan Tanzi" in analysis and "Benjamin Yang and Dylan Tanzi" in article
          assert '<span class="byline-name">Benjamin Yang and Dylan Tanzi</span>' in article
          assert "5,191 records" in article and "5,191 records" in analysis
          assert "no-18-laos-vientiane-museum-plane.jpg" in analysis
          assert "laos-vientiane-museum-plane-1600.jpg" in article
          assert article.count('data-manuscript-paragraph=') == 11
          assert "7 publisher references" in article
          assert "trident-resolve-basarnas-drone" in analysis
          for path in [
            "assets/catalogue/media/no-18-laos-vientiane-museum-plane.jpg",
            "assets/editorial/derivatives/laos-vientiane-museum-plane-1600.jpg",
            "assets/editorial/derivatives/laos-vientiane-museum-plane-800.webp",
            "assets/editorial/derivatives/laos-vientiane-museum-plane-1600.webp",
          ]:
              assert (root/path).is_file(), path
          PY
      - name: Commit strictly six generated paths and nothing else
        run: |
          set -euo pipefail
          FROM="$RUNNER_TEMP/no18-render"
          cp "$FROM/analysis.html" output/analysis.html
          cp "$FROM/briefs/what-is-being-built-in-laos.html" output/briefs/what-is-being-built-in-laos.html
          for f in             assets/catalogue/media/no-18-laos-vientiane-museum-plane.jpg             assets/editorial/derivatives/laos-vientiane-museum-plane-1600.jpg             assets/editorial/derivatives/laos-vientiane-museum-plane-800.webp             assets/editorial/derivatives/laos-vientiane-museum-plane-1600.webp; do
            mkdir -p "output/$(dirname "$f")"
            cp "$FROM/$f" "output/$f"
          done
          git add -A --             output/analysis.html             output/briefs/what-is-being-built-in-laos.html             output/assets/catalogue/media/no-18-laos-vientiane-museum-plane.jpg             output/assets/editorial/derivatives/laos-vientiane-museum-plane-1600.jpg             output/assets/editorial/derivatives/laos-vientiane-museum-plane-800.webp             output/assets/editorial/derivatives/laos-vientiane-museum-plane-1600.webp
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          test -z "$(git diff --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Briefs: stage six scoped No.18 photo outputs"
          git push origin HEAD:editorial/laos-no18-context-photo-20261013

name: Japan JCG gated shadow daily audit — offline contracts

# No schedule or live dispatch: this tests fake GitHub API replies only.
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_jcg_daily_gate.py"
      - "tests/test_jcg_daily_gate_audit.py"
      - "docs/engineering/JAPAN_JCG_SCHEDULE_GATE_OBSERVATION_2026-10-11.md"
      - ".github/workflows/jcg_daily_gate_audit_offline.yml"

permissions:
  contents: read

jobs:
  schedule-gate-observation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Strict GitHub-only gate and state observation
        run: python -m unittest tests.test_jcg_daily_gate_audit -v
      - name: Confirm all production and shadow data remain untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ desks/registry.json config/shadow_source_workflow_bindings.json
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/ shadow/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

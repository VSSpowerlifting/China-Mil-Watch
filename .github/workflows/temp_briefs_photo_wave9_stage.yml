name: Temporary Wave 9 Chinese Coast Guard original photo staging
on:
  push:
    branches: [editorial/briefs-photo-wave9-20261013]
    paths:
      - .github/workflows/temp_briefs_photo_wave9_stage.yml
      - scripts/stage_briefs_photo_wave9.py
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publication requirements and deterministic Pillow
        run: |
          python -m pip install -r requirements.txt
          python -m pip install Pillow==11.3.0
      - name: Obtain checksum-bound USCG original, verify card and source notices
        run: |
          python scripts/stage_briefs_photo_wave9.py
          python scripts/build_catalogue_media.py --check
          python -m unittest tests.test_catalogue_media -v
      - name: Render preview 18 cards with fifteen photographs, not site publish
        run: |
          set -euo pipefail
          python site/render.py --out "$RUNNER_TEMP/wave9-preview"
          python - "$RUNNER_TEMP/wave9-preview" <<'PY'
          import sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path(sys.argv[1])
          soup=BeautifulSoup((root/"analysis.html").read_text(),"html.parser")
          cards=soup.select("article.brief-card")
          photos=[c for c in cards if c.get("data-media")=="photograph"]
          assert len(cards)==18,len(cards)
          assert len(photos)==15,len(photos)
          five=next(c for c in cards if c.select_one(".issue-no") and
             c.select_one(".issue-no").get_text(strip=True)=="No. 5")
          image=five.select_one("img")
          assert image and "chinese-coast-guard-2301-2018" in image["src"]
          assert (root/image["src"]).is_file()
          content=five.get_text(" ",strip=True)
          for marker in ("2301","2018","Sea of Japan","June 2026","loitering-munition",
                         "Rocket Force","William Colclough","does not imply or constitute DoW endorsement"):
              assert marker in content,marker
          seven=next(c for c in cards if c.select_one(".issue-no") and
             c.select_one(".issue-no").get_text(strip=True)=="No. 7")
          assert five.select_one("img")["src"]!=seven.select_one("img")["src"]
          assert "Benjamin Yang and Dylan Tanzi" in (root/"briefs/what-is-being-built-in-laos.html").read_text()
          print("Verified 18 cards, 15 photo context covers, distinct No5/7 sources and No18 coauthors")
          PY
      - name: Commit exactly eight new scoped source and output paths without Pages
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/wave9-preview"
          cp "$OUT/analysis.html" output/analysis.html
          cp "$OUT/assets/catalogue/media/no-05-chinese-coast-guard-2301-2018.jpg" output/assets/catalogue/media/no-05-chinese-coast-guard-2301-2018.jpg
          git add -- site/assets/editorial/manifest.json site/assets/catalogue/admissions.json
          git add -- site/assets/editorial/chinese-coast-guard-2301-2018.jpg
          git add -- site/assets/editorial/derivatives/chinese-coast-guard-2301-2018-1600.jpg
          git add -- site/assets/catalogue/media/no-05-chinese-coast-guard-2301-2018.jpg
          git add -- output/analysis.html output/assets/catalogue/media/no-05-chinese-coast-guard-2301-2018.jpg
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --exit-code -- pla_watch.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+41898282@users.noreply.github.com"
          git commit -m "Briefs: stage independently pinned Chinese Coast Guard 2301 photograph for No5"
          git push origin HEAD:editorial/briefs-photo-wave9-20261013

name: BIS — Authenticated U.S. Desk Metadata Display Contracts

on:
  pull_request:
    paths:
      - site/preview/generate_preview.py
      - site/preview/templates/desk.html
      - tests/test_us_bis_public_metadata_bridge.py
      - .github/workflows/us_bis_public_metadata_bridge_contract.yml
      - docs/engineering/US_BIS_DESK_METADATA_BRIDGE_2026-10-15.md
permissions:
  contents: read

jobs:
  source-free-bis-only-render-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements.txt
      - name: Test source-free BIS links, HTML escaping and empty-page behavior
        run: |
          python -m unittest \
            tests.test_us_bis_public_metadata_bridge \
            tests.test_us_bis_authenticated_metadata \
            tests.test_us_bis_scheduled_receipt_attestation -v
      - name: No tracked database, source or publication writes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code -- pla_watch.db output/ desks/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

name: Temporary Wave 7 historical China Russia photo staging
on:
  push:
    branches: [editorial/briefs-photo-wave7-20261013]
    paths:
      - .github/workflows/temp_briefs_photo_wave7_stage.yml
      - scripts/stage_briefs_photo_wave7.py
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publication requirements and verified encoder
        run: |
          python -m pip install -r requirements.txt
          python -m pip install Pillow==11.3.0
      - name: Acquire reviewed CC BY 4.0 source and test photo admission
        run: |
          python scripts/stage_briefs_photo_wave7.py
          python scripts/build_catalogue_media.py --check
          python -m unittest tests.test_catalogue_media -v
      - name: Render non-publishing 18-card preview
        run: |
          set -euo pipefail
          python site/render.py --out "$RUNNER_TEMP/wave7-site"
          python - "$RUNNER_TEMP/wave7-site" <<'PY'
          import sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path(sys.argv[1])
          soup=BeautifulSoup((root/"analysis.html").read_text(),"html.parser")
          cards=soup.select("article.brief-card")
          photos=[c for c in cards if c.get("data-media")=="photograph"]
          assert len(cards)==18,len(cards)
          assert len(photos)==12,len(photos)
          no11=next(c for c in cards if c.select_one(".issue-no") and
              c.select_one(".issue-no").get_text(strip=True)=="No. 11")
          img=no11.select_one("img")
          assert img and "china-russia-iran-maritime-belt-2023" in img["src"]
          assert (root/img["src"]).is_file()
          text=no11.get_text(" ",strip=True)
          for phrase in ("March 2023","Iran","not the July 2026 Joint Sea","Y-20B","Mohsen Ranginkaman","CC BY 4.0"):
              assert phrase in text,phrase
          assert "Benjamin Yang and Dylan Tanzi" in (root/"briefs/what-is-being-built-in-laos.html").read_text()
          print("No11 historical CC BY photo: 12/18 in preview, all rights/credits and coauthors intact.")
          PY
      - name: Commit only No11 image, metadata and output preview files
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/wave7-site/analysis.html" output/analysis.html
          cp "$RUNNER_TEMP/wave7-site/assets/catalogue/media/no-11-china-russia-iran-maritime-belt-2023.jpg" output/assets/catalogue/media/no-11-china-russia-iran-maritime-belt-2023.jpg
          git add -- site/assets/editorial/manifest.json site/assets/catalogue/admissions.json
          git add -- site/assets/editorial/china-russia-iran-maritime-belt-2023.jpg
          git add -- site/assets/editorial/derivatives/china-russia-iran-maritime-belt-2023-1600.jpg
          git add -- site/assets/catalogue/media/no-11-china-russia-iran-maritime-belt-2023.jpg
          git add -- output/analysis.html output/assets/catalogue/media/no-11-china-russia-iran-maritime-belt-2023.jpg
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --exit-code -- pla_watch.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+41898282@users.noreply.github.com"
          git commit -m "Briefs: stage historical 2023 China-Russia maritime photo for No11"
          git push origin HEAD:editorial/briefs-photo-wave7-20261013

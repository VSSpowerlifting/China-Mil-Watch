name: Prepare Trident Resolve Publication

on:
  push:
    branches:
      - editorial/trident-resolve-publication-prep

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out publication-prep branch
        uses: actions/checkout@v4
        with:
          ref: editorial/trident-resolve-publication-prep
          fetch-depth: 0

      - name: Guard exact approved base
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD e9db628650b281786458d16d79db74fe0f664fe7)" = "e9db628650b281786458d16d79db74fe0f664fe7"
          test "$(git diff --name-only e9db628650b281786458d16d79db74fe0f664fe7...HEAD)" = ".github/workflows/prepare_trident_resolve_publication.yml"
          test "$(git rev-parse origin/main)" = "e9db628650b281786458d16d79db74fe0f664fe7" || {
            echo "::error::main moved after publication preparation began"
            exit 1
          }

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record production database baseline
        run: sha256sum pla_watch.db > /tmp/brief17-db.before

      - name: Recheck candidate readiness
        run: |
          set -euo pipefail
          BRIEF="briefs/trident-resolve-regional-scale-specific-chinese-tasks.json"
          python scripts/author_brief.py check "$BRIEF"
          python scripts/author_brief.py ready "$BRIEF"

      - name: Record owner approval and assign next Brief number
        run: |
          set -euo pipefail
          BRIEF="briefs/trident-resolve-regional-scale-specific-chinese-tasks.json"
          python scripts/author_brief.py approve "$BRIEF" \
            --approved-by "Benjamin Yang" \
            --approved-on "2026-10-07" \
            --approval-reference "ChatGPT authorization on 2026-10-07 after merge of PR #122 at exact candidate head 95a073501b6292ca13620dab6edf0569749970b7"

      - name: Validate approved Brief
        run: |
          set -euo pipefail
          BRIEF="briefs/trident-resolve-regional-scale-specific-chinese-tasks.json"
          python scripts/author_brief.py check "$BRIEF"
          python scripts/author_brief.py ready "$BRIEF"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("briefs/trident-resolve-regional-scale-specific-chinese-tasks.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["editorial_status"] == "approved"
          assert j["issue_number"] == 17, j["issue_number"]
          assert j["approval"]["approved_by"] == "Benjamin Yang"
          assert j["approval"]["approved_on"] == "2026-10-07"
          PY

      - name: Render Indo-Pacific Record
        run: python site/render.py --mode indo-pacific-record

      - name: Validate rendered output
        run: python scripts/validate_output.py

      - name: Run focused Brief regression tests
        run: |
          python -m unittest \
            tests.test_brief_publication \
            tests.test_briefs_collection \
            tests.test_ipr_briefs -v

      - name: Verify database preservation and rendered Brief surfaces
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > /tmp/brief17-db.after
          diff -u /tmp/brief17-db.before /tmp/brief17-db.after
          PAGE="output/briefs/trident-resolve-regional-scale-specific-chinese-tasks.html"
          test -f "$PAGE"
          grep -Fq "Trident Resolve: What the Exercise Looked Like From Singapore and China" "$PAGE"
          grep -Fq "No. 17" "$PAGE"
          grep -Fq 'href="#r-4392"' "$PAGE"
          grep -Fq 'href="#r-4935"' "$PAGE"
          grep -Fq "Trident Resolve: What the Exercise Looked Like From Singapore and China" output/analysis.html
          grep -Fq "Trident Resolve: What the Exercise Looked Like From Singapore and China" output/briefs/feed.xml
          grep -Fq "trident-resolve-regional-scale-specific-chinese-tasks" output/sitemap.xml

      - name: Commit publication-prep candidate and remove one-shot workflow
        run: |
          set -euo pipefail
          WORKFLOW=".github/workflows/prepare_trident_resolve_publication.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs/trident-resolve-regional-scale-specific-chinese-tasks.json output/
          git rm "$WORKFLOW"
          git commit -m "Approve and render Trident Resolve Brief"
          git push origin HEAD:editorial/trident-resolve-publication-prep

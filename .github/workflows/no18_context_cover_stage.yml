name: Temporary No.18 contextual photograph staging
on:
  push:
    branches: [editorial/laos-no18-context-photo-20261013]
    paths: [.github/workflows/no18_context_cover_stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use pinned Pillow for deterministic asset records
        run: python -m pip install Pillow==11.3.0
      - name: Retrieve inspected CC BY 4.0 Wikimedia original and stage audited derivatives
        run: python scripts/stage_no18_context_photo.py
      - name: Commit only No. 18 image and its two admission records
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/assets/editorial/manifest.json site/assets/catalogue/admissions.json
          git add -- site/assets/editorial/laos-vientiane-museum-plane.jpg
          git add -- site/assets/editorial/derivatives/laos-vientiane-museum-plane-1600.jpg
          git add -- site/assets/editorial/derivatives/laos-vientiane-museum-plane-800.webp
          git add -- site/assets/editorial/derivatives/laos-vientiane-museum-plane-1600.webp
          git add -- site/assets/catalogue/media/no-18-laos-vientiane-museum-plane.jpg
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m "Briefs: stage CC BY 4.0 Laos contextual photo with hash-linked assets"
          git push origin HEAD:editorial/laos-no18-context-photo-20261013

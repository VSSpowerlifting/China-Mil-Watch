name: Indonesia and South Korea Shadow Collection

# Prepared manual launch only. No cron is enabled by this candidate build.
# Running this workflow after an authorized merge publishes public state on the
# selected desk's separate orphan branch. It never deploys or changes the record.
on:
  workflow_dispatch:
    inputs:
      desk:
        type: choice
        description: Shadow candidate to collect
        required: true
        options:
          - indonesia
          - korea
      target_date:
        description: Logical UTC date (YYYY-MM-DD); empty means today's UTC date
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: candidate-shadow-${{ inputs.desk }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the exact collector
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: repo
          persist-credentials: false

      - name: Select the fixed desk branch
        env:
          DESK_INPUT: ${{ inputs.desk }}
        run: |
          set -euo pipefail
          case "$DESK_INPUT" in
            indonesia) state_branch=shadow/indonesia-kemhan ;;
            korea) state_branch=shadow/korea-policy-briefing ;;
            *) exit 1 ;;
          esac
          echo "SHADOW_DESK=$DESK_INPUT" >> "$GITHUB_ENV"
          echo "STATE_BRANCH=$state_branch" >> "$GITHUB_ENV"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r repo/requirements.txt

      - name: Run offline contract tests
        working-directory: repo
        run: python -m unittest tests.test_indonesia_korea_shadow -q

      - name: Check out isolated state
        env:
          STATE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          status=0
          git ls-remote --exit-code --heads "$STATE_REMOTE" "refs/heads/$STATE_BRANCH" \
            > "${RUNNER_TEMP}/shadow-head" || status=$?
          if [ "$status" -eq 0 ]; then
            git clone --branch "$STATE_BRANCH" --single-branch "$STATE_REMOTE" \
              "${RUNNER_TEMP}/candidate-state"
          elif [ "$status" -eq 2 ]; then
            git init "${RUNNER_TEMP}/candidate-state"
            git -C "${RUNNER_TEMP}/candidate-state" checkout --orphan "$STATE_BRANCH"
            git -C "${RUNNER_TEMP}/candidate-state" remote add origin "$STATE_REMOTE"
          else
            exit "$status"
          fi
          cd "${RUNNER_TEMP}/candidate-state"
          test "$(git branch --show-current)" = "$STATE_BRANCH"
          if git rev-parse --verify --quiet HEAD >/dev/null; then
            if git ls-tree --name-only HEAD | grep -v '^state$'; then
              echo "::error::non-state content on the state branch"
              exit 1
            fi
          fi

      - name: Collect the declared window
        working-directory: repo
        env:
          TARGET_DATE_INPUT: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET_DATE_INPUT" ]; then
            set -- --target-date "$TARGET_DATE_INPUT"
          else
            set --
          fi
          python scripts/shadow_collect_desk.py --desk "$SHADOW_DESK" \
            --state-dir "${RUNNER_TEMP}/candidate-state/state" \
            --lookback-days 6 --cap 40 \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --commit "$(git rev-parse HEAD)" --event-name "$GITHUB_EVENT_NAME" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" "$@" \
            2>&1 | tee "${RUNNER_TEMP}/candidate-run.log"

      - name: Assert collector and historical state preservation
        if: always()
        run: |
          set -euo pipefail
          test -z "$(git -C repo status --porcelain)"
          cd "${RUNNER_TEMP}/candidate-state"
          if git rev-parse --verify --quiet HEAD >/dev/null; then
            changed=$(git diff --name-status -- state/ledger state/clock.json | grep -E '^(M|D|R)' || true)
            test -z "$changed"
          fi

      - name: Publish successful state to its explicit branch
        if: success()
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/candidate-state"
          test "$(git branch --show-current)" = "$STATE_BRANCH"
          test ! -e state/shadow.db-wal
          test ! -e state/shadow.db-shm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            exit 0
          fi
          collector_commit=$(git -C "${GITHUB_WORKSPACE}/repo" rev-parse HEAD)
          git commit -m "shadow($SHADOW_DESK): run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -m "Collector $collector_commit. State only; never merged to main."
          git push origin "HEAD:refs/heads/$STATE_BRANCH"

      - name: Preserve complete attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-shadow-${{ inputs.desk }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-state/state/
            ${{ runner.temp }}/candidate-run.log
          if-no-files-found: warn
          retention-days: 90

# Disposable one-shot check. DELETE after focused run; never merge.
name: Vietnam checkpoint triplet focused offline verification
on:
  push:
    branches:
      - feat/vietnam-ministry-three-source-checkpoint-rollup-20261008
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event.head_commit.message == 'Run one-shot Vietnam checkpoint rollup tests' && github.ref == 'refs/heads/feat/vietnam-ministry-three-source-checkpoint-rollup-20261008' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated candidate, read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic checkpoint rollup and ministry review tests
        run: python -m unittest tests.test_vietnam_ministry_checkpoint_rollup tests.test_vietnam_ministry_remote_review -v

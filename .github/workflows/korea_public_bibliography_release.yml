name: Korea Desk — fourteen official-source links release

# Explicit owner-authorized publication of government bibliography only.
# Push on an owner-reviewed release-contract change publishes exactly five
# original bibliographic entries and nine newly approved outbound MND URLs.
# Never requests a Korean publisher, shadow Git, HWPX, model or new collector.
on:
  pull_request:
    paths:
      - "research/korea_public_reference_ids.json"
      - "research/korea_additional_public_official_links_2026-10-15.json"
      - "research/korea/MND_14_PUBLIC_LINK_REVIEW_CANDIDATES_2026-10-15.json"
      - "core/korea_additional_public_links.py"
      - "scripts/preview_korea_fourteen_official_links.py"
      - "tests/test_korea_additional_public_links.py"
      - "core/korea_public_bibliography.py"
      - "desks/registry.json"
      - "site/preview/generate_preview.py"
      - "site/preview/templates/desk.html"
      - "site/preview/desk-references.css"
      - "tests/test_korea_public_bibliography.py"
      - "tests/test_korea_official_index.py"
      - "tests/test_korea_internal_registry.py"
      - "tests/test_korea_site_preview.py"
      - "scripts/guard_country_research_output_scope.py"
      - "scripts/guard_korea_public_output_scope.py"
      - "tests/test_korea_output_release_scope.py"
      - ".github/workflows/korea_public_bibliography_release.yml"
  push:
    branches: [main]
    paths:
      - "research/korea_public_reference_ids.json"
      - "research/korea_additional_public_official_links_2026-10-15.json"
      # An owner-reviewed merge of this release contract intentionally publishes
      # the already approved Korea bibliography/navigation changes on main.
      - ".github/workflows/korea_public_bibliography_release.yml"

permissions:
  contents: read

jobs:
  source-link-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install actual site dependencies
        run: python -m pip install -r requirements.txt
      - name: Preserve production database checksum
        run: sha256sum pla_watch.db > /tmp/ipr-korea-links-db.sha
      - name: Full source-link and original-review regression checks
        run: |
          python -m unittest tests.test_korea_output_release_scope tests.test_korea_official_index tests.test_korea_public_bibliography tests.test_korea_additional_public_links tests.test_korea_internal_registry tests.test_korea_site_preview tests.test_korea_reference_gate tests.test_public_desk_references tests.test_desk_map tests.test_desk_rollout_contract tests.test_briefs_collection tests.test_extraction_interface -q
      - name: Render real public site, no collectors or media reuse
        shell: bash
        run: |
          set -euo pipefail
          python site/render.py
          python scripts/validate_output.py
          python - <<'PY'
          from pathlib import Path
          from core.korea_public_bibliography import load_public_korea_links
          from core.korea_additional_public_links import load_additional_korea_official_links
          rows = load_public_korea_links()
          additional = load_additional_korea_official_links()
          assert len(rows) == 5 and len(additional) == 9
          import json
          korea = next(x for x in json.loads(Path("desks/registry.json").read_text())["desks"]
                       if x["slug"] == "korea")
          assert korea["public"] is True and korea["status"] == "shadow"
          assert korea["manifest"] is None and korea["has_production_records"] is False
          base = Path("output")
          html = (base/"korea.html").read_text(encoding="utf-8")
          assert html.count('data-korea-public-link=') == 5
          assert html.count('data-korea-additional-link=') == 9
          from core.korea_official_live_links import load_live_korea_official_links
          fixed = {x["source_identity"] for x in load_public_korea_links() + additional}
          auto = load_live_korea_official_links("pla_watch.db", exclude=fixed)
          assert html.count('data-korea-auto-official-link=') == len(auto)
          assert html.count('https://www.korea.kr/briefing/pressReleaseView.do?newsId=') == 14 + len(auto)
          assert '<nav class="korea-publisher-shortcuts"' in html
          assert html.index('korea-publisher-shortcuts-title') < html.index('data-korea-public-link=')
          assert html.count("Open official publisher index") == 2
          auto_ids = {x["source_identity"].partition(":")[2] for x in auto}
          for unreviewed_id in ("156784618", "156784625"):
              if unreviewed_id not in auto_ids:
                  assert unreviewed_id not in html
          assert "not IPR archived records" in html
          assert "https://www.korea.kr/guide/copyRight.do" in html
          assert "2026-10-04" in html and "2026-10-06" in html
          for row in additional:
              assert row["source_url"] in html
          assert "unresolved excavation-year discrepancy" in html
          assert "noindex, nofollow" not in html
          for forbidden in ("text_original", "body_original", "download.do?fileId=",
                            "data-review-status=", "english_description"):
              assert forbidden not in html, forbidden
          for row in rows:
              assert row["source_url"] in html
          assert 'href="korea.html"' in (base/"desks.html").read_text(encoding="utf-8")
          assert "https://indopacificrecord.org/korea.html" in (
              base/"sitemap.xml").read_text(encoding="utf-8")
          print("Public metadata-only Korea route: five original entries plus nine URL-only references; no source media or body.")
          PY
          sha256sum -c /tmp/ipr-korea-links-db.sha
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
          git diff --exit-code -- pla_watch.db

  # Superseded by the metadata-only Korea file publisher. Never run this
  # historical broad-tree peaceiris release after automatic admission starts.
  release:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    concurrency:
      group: daily-update
      cancel-in-progress: false
    steps:
      - name: Check out current main, with output history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Pin exact release SHA and production data checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > "$RUNNER_TEMP/korea-links-db.sha"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD > "$RUNNER_TEMP/korea-links-head"
      - name: Install renderer dependencies only
        run: python -m pip install -r requirements.txt
      - name: Validate production corpus is current
        run: python scripts/verify_db_current.py
      - name: Render the actual static website and assert exact public scope
        shell: bash
        run: |
          set -euo pipefail
          python site/render.py
          python scripts/validate_output.py
          python -m unittest tests.test_korea_output_release_scope tests.test_korea_public_bibliography tests.test_korea_additional_public_links tests.test_korea_internal_registry -q
          python - <<'PY'
          from pathlib import Path
          from core.korea_public_bibliography import load_public_korea_links
          assert len(load_public_korea_links()) == 5
          from core.korea_additional_public_links import load_additional_korea_official_links
          additional = load_additional_korea_official_links()
          assert len(additional) == 9
          import json
          k = next(x for x in json.loads(Path("desks/registry.json").read_text())["desks"]
                   if x["slug"] == "korea")
          assert k["public"] is True and k["status"] == "shadow"
          assert k["manifest"] is None and k["has_production_records"] is False
          p = Path("output")
          html = (p/"korea.html").read_text(encoding="utf-8")
          assert html.count('data-korea-public-link=') == 5
          assert html.count('data-korea-additional-link=') == 9
          from core.korea_official_live_links import load_live_korea_official_links
          fixed = {x["source_identity"] for x in load_public_korea_links() + additional}
          auto = load_live_korea_official_links("pla_watch.db", exclude=fixed)
          assert html.count('data-korea-auto-official-link=') == len(auto)
          assert html.count('https://www.korea.kr/briefing/pressReleaseView.do?newsId=') == 14 + len(auto)
          for row in additional:
              assert row["source_url"] in html
          assert "unresolved excavation-year discrepancy" in html
          assert "not IPR archived records" in html
          # Outbound publisher navigation only: two distinct Korean issuers,
          # never a sixth archived record or DAPA collection approval.
          from html import escape
          source_families = k["research"]["source_families"]
          assert len(source_families) == 2
          assert html.count("Open official publisher index") == 2
          assert "Research-only source family; no DAPA records admitted" in html
          for rep_code, source in zip(("A00005", "B00008"), source_families):
              url = source["publisher_url"]
              assert url.startswith("https://www.korea.kr/briefing/pressReleaseList.do?")
              from urllib.parse import parse_qs, urlsplit
              assert parse_qs(urlsplit(url).query).get("repCode") == [rep_code]
              assert ('href="' + escape(url, quote=True) + '"') in html
          auto_ids = {x["source_identity"].partition(":")[2] for x in auto}
          for unreviewed_id in ("156784618", "156784625"):
              if unreviewed_id not in auto_ids:
                  assert unreviewed_id not in html
          assert "Shadow evaluation — not in corpus" in (
              p/"desks.html").read_text(encoding="utf-8")
          assert "noindex, nofollow" not in html
          assert "2026-10-04" in html and "2026-10-06" in html
          for forbidden in ("body_original", "text_original", "download.do?fileId=",
                            "data-review-status=", "english_description"):
              assert forbidden not in html
          assert 'href="korea.html"' in (p/"desks.html").read_text(encoding="utf-8")
          assert "https://indopacificrecord.org/korea.html" in (
              p/"sitemap.xml").read_text(encoding="utf-8")
          print("Korea official-links-only release validated.")
          PY
          sha256sum -c "$RUNNER_TEMP/korea-links-db.sha"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
          git diff --exit-code -- pla_watch.db
      # Publishing uploads the full ./output directory, including ignored media.
      # A Korea-only publication may not carry unrelated desk/Briefs drift.
      - name: Refuse unrelated generated-site changes
        id: korea-output-scope
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.guard_korea_public_output_scope
          if git diff --quiet -- output/korea.html output/desk-references.css; then
            echo "publish_required=false" >> "$GITHUB_OUTPUT"
            echo "No Korea-specific output change; skipping commit and Pages deployment."
          else
            echo "publish_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage only Korea page and reviewed shared reference styles
        if: steps.korea-output-scope.outputs.publish_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- output/korea.html output/desk-references.css
          python -m scripts.guard_korea_public_output_scope
          git diff --cached --name-status
          test -n "$(git diff --cached --name-only)" || {
            echo "::error::Expected approved Korea output changes"; exit 1;
          }
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^([AMDRC ][AMDRC ]|[?][?]) output/' || true)"
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/korea-links-head")"

      - name: Commit exact public output to main
        if: steps.korea-output-scope.outputs.publish_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish limited Korea official-source bibliography"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/korea-links-head")" || {
            echo "::error::Main moved; stopping instead of publishing an unreviewed revision"; exit 1;
          }
          git push origin HEAD:main
      - name: Publish validated static output to GitHub Pages
        if: steps.korea-output-scope.outputs.publish_required == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          cname: indopacificrecord.org
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Korea fourteen-link directory: ${{ github.run_id }}'

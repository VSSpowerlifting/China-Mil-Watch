name: One-time Dossier pure contract smoke

on:
  push:
    branches: [feat/dossier-v1-pure-contract-20261009]
    paths:
      - core/dossier_contract.py
      - tests/test_dossier_contract.py
      - tests/fixtures/dossiers/fictional-exercise-reporting.json
      - .github/workflows/dossier_contract_smoke_temp.yml

permissions:
  contents: read

jobs:
  dossier-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile offline contract and synthetic tests
        run: python -m py_compile core/dossier_contract.py tests/test_dossier_contract.py
      - name: Run synthetic dossier contract suite
        run: python -m unittest tests.test_dossier_contract -v
      - name: Prove no tracked production change
        run: |
          git diff --exit-code -- pla_watch.db output/ briefs/ timelines/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

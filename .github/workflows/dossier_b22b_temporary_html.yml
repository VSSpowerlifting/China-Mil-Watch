# Temporary read-only stacked synthetic test; delete after review receipt.
name: B2.2b standalone fictional HTML test
on:
  pull_request:
    branches: [feat/dossier-b22-private-reader-model-20261010]
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  fictional-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Compile all six Dossier slices
        run: python -m compileall -q core/dossier_contract.py core/dossier_sources.py core/dossier_publication.py core/dossier_private_view.py core/dossier_private_html.py scripts/validate_dossiers.py tests/test_dossier_contract.py tests/test_dossier_sources.py tests/test_validate_dossiers.py tests/test_dossier_publication.py tests/test_dossier_private_view.py tests/test_dossier_private_html.py
      - name: Run full six-slice fictional integration suite
        run: python -m unittest tests.test_dossier_contract tests.test_dossier_sources tests.test_validate_dossiers tests.test_dossier_publication tests.test_dossier_private_view tests.test_dossier_private_html -v
      - name: Verify database and generated output unchanged
        run: |
          git diff --exit-code -- pla_watch.db output briefs timelines
          test ! -e pla_watch.db-wal && test ! -e pla_watch.db-shm

name: Temporary Wave 4 same-vessel RSS Steadfast photo staging
on:
  push:
    branches: [editorial/briefs-photo-wave4-20261013]
    paths:
      - .github/workflows/temp_briefs_photo_wave4_stage.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unchanged requirements and photo encoder
        run: |
          python -m pip install -r requirements.txt
          python -m pip install Pillow==11.3.0
      - name: Verify official US Navy original identity and DVIDS preview source
        run: |
          python scripts/stage_briefs_photo_wave4.py
          python scripts/build_catalogue_media.py --check
          python -m unittest tests.test_catalogue_media -v
      - name: Render isolated nine-photograph catalogue without publishing
        run: |
          set -euo pipefail
          python site/render.py --out "$RUNNER_TEMP/wave4-render"
          python - "$RUNNER_TEMP/wave4-render" <<'PY'
          import sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path(sys.argv[1])
          soup=BeautifulSoup((root/"analysis.html").read_text(), "html.parser")
          cards=soup.select("article.brief-card")
          photos=[a for a in cards if a.get("data-media")=="photograph"]
          assert len(cards)==18,len(cards)
          assert len(photos)==9,len(photos)
          card=next(c for c in cards if c.select_one(".issue-no") and
            c.select_one(".issue-no").get_text(strip=True)=="No. 15")
          pic=card.select_one("img")
          assert pic and "rss-steadfast-pearl-harbor-2026" in pic["src"]
          assert (root/pic["src"]).is_file()
          caption=card.get_text(" ",strip=True)
          for required in ["RSS Steadfast (70)","22 June 2026","September","does not depict",
                           "does not imply or constitute DoW endorsement"]:
              assert required in caption,required
          unchanged=(root/"briefs/what-is-being-built-in-laos.html").read_text()
          assert "Benjamin Yang and Dylan Tanzi" in unchanged
          print("Rendered 18 cards, nine photos; verified No.15 ship identity, photo path, date, caveat and notice.")
          PY
      - name: Commit exactly six new source paths and two output paths, staging only
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/wave4-render/analysis.html" output/analysis.html
          cp "$RUNNER_TEMP/wave4-render/assets/catalogue/media/no-15-rss-steadfast-pearl-harbor-2026.jpg" output/assets/catalogue/media/no-15-rss-steadfast-pearl-harbor-2026.jpg
          git add -- site/assets/editorial/manifest.json site/assets/catalogue/admissions.json
          git add -- site/assets/editorial/rss-steadfast-pearl-harbor-2026.jpg
          git add -- site/assets/editorial/derivatives/rss-steadfast-pearl-harbor-2026-1600.jpg
          git add -- site/assets/catalogue/media/no-15-rss-steadfast-pearl-harbor-2026.jpg
          git add -- output/analysis.html output/assets/catalogue/media/no-15-rss-steadfast-pearl-harbor-2026.jpg
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --exit-code -- pla_watch.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+41898282@users.noreply.github.com"
          git commit -m "Briefs: stage source-verified No.15 same-vessel US Navy photo and catalogue output"
          git push origin HEAD:editorial/briefs-photo-wave4-20261013

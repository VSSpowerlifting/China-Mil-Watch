name: Temporary Wave 3 NASA and USCG photo staging
on:
  push:
    branches: [editorial/briefs-photo-wave3-20261013]
    paths:
      - .github/workflows/temp_briefs_photo_wave3_stage.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned photographic encoder and unchanged publication dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install Pillow==11.3.0
      - name: Fetch publisher originals, validate source identity and build admitted cards
        run: |
          python scripts/stage_briefs_photo_wave3.py
          python scripts/build_catalogue_media.py --check
          python -m unittest tests.test_catalogue_media -v
      - name: Render a separate non-publishing preview and enforce photographic catalogue scope
        run: |
          set -euo pipefail
          python site/render.py --out "$RUNNER_TEMP/briefs-wave3"
          python - "$RUNNER_TEMP/briefs-wave3" <<'PY'
          import sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path(sys.argv[1])
          html=(root/"analysis.html").read_text()
          dom=BeautifulSoup(html,"html.parser")
          cards=dom.select("article.brief-card")
          assert len(cards)==18,len(cards)
          pictures=[x for x in cards if x.get("data-media")=="photograph"]
          assert len(pictures)==8,len(pictures)
          for issue,stem in [(7,"ccg-shadowing-uscg-stratton-2019"),(13,"scarborough-shoal-nasa-iss77330")]:
              card=next(x for x in cards if x.select_one(".issue-no") and x.select_one(".issue-no").get_text(strip=True)==f"No. {issue}")
              src=card.select_one("img")["src"]
              assert stem in src,(issue,src)
              assert (root/src).is_file(),src
              assert "2026" in card.get_text(" ",strip=True)
              assert "2019" in card.get_text(" ",strip=True) if issue==7 else "2015" in card.get_text(" ",strip=True)
              if issue==7:
                  assert "does not imply or constitute DoW endorsement" in card.get_text(" ",strip=True)
          assert "Benjamin Yang and Dylan Tanzi" in (root/"briefs/what-is-being-built-in-laos.html").read_text()
          print("Rendered 18 cards, eight photographic, with verified No.7 and No.13 notices/captions.")
          PY
      - name: Stage only approved candidate paths and never publish to Pages
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/briefs-wave3/analysis.html" output/analysis.html
          cp "$RUNNER_TEMP/briefs-wave3/assets/catalogue/media/no-07-ccg-shadowing-uscg-stratton-2019.jpg" output/assets/catalogue/media/no-07-ccg-shadowing-uscg-stratton-2019.jpg
          cp "$RUNNER_TEMP/briefs-wave3/assets/catalogue/media/no-13-scarborough-shoal-nasa-iss77330.jpg" output/assets/catalogue/media/no-13-scarborough-shoal-nasa-iss77330.jpg
          git add -- site/assets/catalogue/admissions.json site/assets/editorial/manifest.json
          git add -- site/assets/editorial/ccg-shadowing-uscg-stratton-2019.jpg site/assets/editorial/scarborough-shoal-nasa-iss77330.jpg
          git add -- site/assets/editorial/derivatives/ccg-shadowing-uscg-stratton-2019-1600.jpg site/assets/editorial/derivatives/scarborough-shoal-nasa-iss77330-1600.jpg
          git add -- site/assets/catalogue/media/no-07-ccg-shadowing-uscg-stratton-2019.jpg site/assets/catalogue/media/no-13-scarborough-shoal-nasa-iss77330.jpg
          git add -- output/analysis.html output/assets/catalogue/media/no-07-ccg-shadowing-uscg-stratton-2019.jpg output/assets/catalogue/media/no-13-scarborough-shoal-nasa-iss77330.jpg
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 11
          git diff --exit-code -- pla_watch.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+41898282@users.noreply.github.com"
          git commit -m "Briefs: stage locally retained NASA and USCG photographic cards No.7/13"
          git push origin HEAD:editorial/briefs-photo-wave3-20261013

name: One-time dossier B0 source preservation verification

on:
  push:
    branches:
      - research/dossier-pilot-audit-20261009
    paths:
      - scripts/check_dossier_b0_preservation.py
      - tests/test_dossier_b0_preservation.py
      - .github/workflows/dossier_b0_preservation_temp.yml

permissions:
  contents: read

jobs:
  check-b0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Save repository preservation proof
        shell: bash
        run: |
          sha256sum pla_watch.db > /tmp/db-before.sha
          git status --porcelain --untracked-files=all -- pla_watch.db output/ > /tmp/status-before.txt
      - name: Run synthetic negative tests
        run: python -m unittest tests.test_dossier_candidate_audit tests.test_dossier_b0_preservation -v
      - name: Verify stored originals and metadata without printing source text
        run: python scripts/check_dossier_b0_preservation.py --strict
      - name: Prove archive, published output and sidecar cleanliness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/db-before.sha
          git diff --exit-code -- pla_watch.db output/ briefs/ timelines/
          diff -u /tmp/status-before.txt <(git status --porcelain --untracked-files=all -- pla_watch.db output/)
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

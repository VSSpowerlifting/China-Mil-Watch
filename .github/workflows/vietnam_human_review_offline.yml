name: Vietnam Source-Cited Human Review — Offline Contracts

# No publisher access, model, SMTP, source approval, draft publication,
# repository write token, or public artifact. Test only staged metadata.
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/bridge_vietnam_reviewed_brief_citations.py"
      - "scripts/prepare_vietnam_unsigned_citation_review.py"
      - "tests/test_vietnam_reviewed_brief_citations.py"
      - "tests/test_vietnam_unsigned_citation_review.py"
      - ".github/workflows/vietnam_human_review_offline.yml"
      - "docs/VIETNAM_REVIEWED_EXTERNAL_CITATION_BRIDGE_2026-10-08.md"

permissions:
  contents: read

concurrency:
  group: vietnam-human-review-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unsigned-and-verified-source-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed review tools without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install project offline test dependencies
        run: python -m pip install -r requirements.txt
      - name: Reject forged source facts, rights, review status and copied bodies
        run: |
          python -m unittest \
            tests.test_vietnam_reviewed_brief_citations \
            tests.test_vietnam_unsigned_citation_review -v
      - name: Confirm no tracked or untracked research artifacts were created
        run: test -z "$(git status --porcelain --untracked-files=all)"

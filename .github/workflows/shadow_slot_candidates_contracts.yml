name: Offline shadow logical-slot candidate contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/reconcile_shadow_slot_candidates.py'
      - 'tests/test_shadow_slot_candidates.py'
      - 'docs/SHADOW_SLOT_CANDIDATE_RECONCILIATION.md'
      - '.github/workflows/shadow_slot_candidates_contracts.yml'
      - 'core/shadow_schedule.py'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Record existing archive byte checksum
        id: before
        run: |
          echo "db=$(sha256sum pla_watch.db | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Validate conservative offline schedule-slot contracts
        run: python -m unittest tests.test_shadow_slot_candidates -v
      - name: Prove tracked production database/output preserved
        if: ${{ !cancelled() && steps.before.outcome == 'success' }}
        run: |
          test "$(sha256sum pla_watch.db | cut -d' ' -f1)" = "${{ steps.before.outputs.db }}"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

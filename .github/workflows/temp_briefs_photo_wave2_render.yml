name: Temporary Wave 2 Briefs catalogue render and QA
on:
  push:
    branches: [editorial/briefs-photo-wave2-20261013]
    paths:
      - .github/workflows/temp_briefs_photo_wave2_render.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unchanged publication dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify hashes and 18-slot catalogue
        run: |
          python scripts/build_catalogue_media.py --check
          python -m unittest tests.test_catalogue_media -v
      - name: Render isolated IPR site (no live Pages writer)
        run: |
          set -euo pipefail
          python site/render.py --out "$RUNNER_TEMP/photo-wave2-render"
          python - "$RUNNER_TEMP/photo-wave2-render" <<'PY'
          import sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          root = Path(sys.argv[1])
          page = BeautifulSoup((root/"analysis.html").read_text(), "html.parser")
          cards = page.select("article.brief-card")
          assert len(cards) == 18, len(cards)
          photographs = [c for c in cards if c.get("data-media") == "photograph"]
          assert len(photographs) == 6, len(photographs)
          for number, keyword in [(6, "liaoning-j15-may2022"), (14, "rimpac-china-indonesia-2016")]:
              card = next(c for c in cards if c.select_one(".issue-no") and
                          c.select_one(".issue-no").get_text(strip=True) == f"No. {number}")
              img = card.select_one("img")
              assert img is not None and keyword in img["src"], number
              assert (root / img["src"]).is_file(), (number, img["src"])
              assert "not" in card.get_text(" ", strip=True).lower(), number
          assert "does not imply or constitute DoW endorsement" in page.get_text(), "DVIDS notice"
          assert (root/"briefs/what-is-being-built-in-laos.html").is_file()
          assert "Benjamin Yang and Dylan Tanzi" in (root/"briefs/what-is-being-built-in-laos.html").read_text()
          print("18 cards, six photographs; No. 6/14 assets and captions pass.")
          PY
      - name: Stage precisely three new catalogue output paths
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/photo-wave2-render"
          cp "$OUT/analysis.html" output/analysis.html
          cp "$OUT/assets/catalogue/media/no-06-liaoning-j15-may2022.jpg" output/assets/catalogue/media/no-06-liaoning-j15-may2022.jpg
          cp "$OUT/assets/catalogue/media/no-14-rimpac-china-indonesia-2016.jpg" output/assets/catalogue/media/no-14-rimpac-china-indonesia-2016.jpg
          git add -- output/analysis.html output/assets/catalogue/media/no-06-liaoning-j15-may2022.jpg output/assets/catalogue/media/no-14-rimpac-china-indonesia-2016.jpg
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --exit-code -- pla_watch.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+41898282@users.noreply.github.com"
          git commit -m "Briefs: stage rendered No. 6 and No. 14 photo cards only"
          git push origin HEAD:editorial/briefs-photo-wave2-20261013

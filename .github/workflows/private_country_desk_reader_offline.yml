name: Philippines Vietnam Korea private desk reader — offline functional tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/private_country_desk_reader.py"
      - "tests/test_private_country_desk_reader.py"
      - "docs/engineering/PHILIPPINES_VIETNAM_PRIVATE_RESEARCH_DESKS_2026-10-11.md"
      - "docs/engineering/KOREA_PRIVATE_RESEARCH_READER_2026-10-11.md"
      - ".github/workflows/private_country_desk_reader_offline.yml"

permissions:
  contents: read

jobs:
  functional-reader-no-network:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Search real synthetic Git/SQLite snapshots, inspect HTML safely
        run: python -m unittest tests.test_private_country_desk_reader -v
      - name: No source-state, production DB, registry or output changes
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ shadow/ desks/registry.json
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/ shadow/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

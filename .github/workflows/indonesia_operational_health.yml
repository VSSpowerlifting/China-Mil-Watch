name: Indonesia Desk — daily operational health (read only)

# Inspect persisted Indonesia state plus published Pages. This does not collect,
# open ministry pages, claim a complete Actions attempt audit or alter corpus.
on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
    paths:
      - ".github/workflows/indonesia_operational_health.yml"
  workflow_dispatch:
    inputs:
      expected_logical_day:
        description: 'Optional YYYY-MM-DD nominal collection date to replay'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - "scripts/indonesia_operational_health.py"
      - "tests/test_indonesia_operational_health.py"
      - ".github/workflows/indonesia_operational_health.yml"

permissions:
  contents: read

concurrency:
  group: indonesia-readonly-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Synthetic schedule/ledger and published-link tamper checks
        run: python -m unittest tests.test_indonesia_operational_health -v
      - name: Assert no tracked output or source state was modified
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ shadow/

  monitor:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
         startsWith(github.event.head_commit.message, 'Enable Indonesia daily operational health (PR #438)'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out read-only engineering workspace
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Record immutable production files
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > "$RUNNER_TEMP/indonesia-health-db.sha"
          find output -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/indonesia-health-output.sha"
      - name: Pin isolated Indonesia shadow state and published Pages Git tree
        shell: bash
        env:
          ORIGIN_REPO: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/indonesia-health-state"
          git -C "$RUNNER_TEMP/indonesia-health-state" init -q
          git -C "$RUNNER_TEMP/indonesia-health-state" remote add origin "$ORIGIN_REPO"
          git -C "$RUNNER_TEMP/indonesia-health-state" fetch --quiet --no-tags --depth=1 origin \
            refs/heads/shadow/indonesia-kemhan:refs/heads/shadow/indonesia-kemhan
          tip="$(git -C "$RUNNER_TEMP/indonesia-health-state" rev-parse refs/heads/shadow/indonesia-kemhan)"
          test "${#tip}" -eq 40
          test "$(git -C "$RUNNER_TEMP/indonesia-health-state" ls-tree --name-only "$tip")" = state
          echo "INDONESIA_PINNED_COMMIT=$tip" >> "$GITHUB_ENV"
          git fetch --quiet --no-tags --depth=1 origin \
            refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git show refs/remotes/origin/gh-pages:indonesia.html > "$RUNNER_TEMP/indonesia-published.html"
      - name: Run pinned ledger-chain, scheduled-slot and public-link health check
        shell: bash
        env:
          EXPECTED_DAY: ${{ inputs.expected_logical_day }}
        run: |
          set -euo pipefail
          if [ -n "$EXPECTED_DAY" ]; then
            set -- --as-of "$EXPECTED_DAY"
          else
            set --
          fi
          python -m scripts.indonesia_operational_health \
            --state-repo "$RUNNER_TEMP/indonesia-health-state" \
            --state-commit "$INDONESIA_PINNED_COMMIT" \
            --published-page "$RUNNER_TEMP/indonesia-published.html" \
            --receipt "$RUNNER_TEMP/INDONESIA_HEALTH_RECEIPT.json" "$@"
      - name: Verify unchanged protected production DB and generated site
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/indonesia-health-db.sha"
          sha256sum -c "$RUNNER_TEMP/indonesia-health-output.sha" > /dev/null
          git diff --exit-code -- pla_watch.db output/ shadow/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Retain only count-only monitoring receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indonesia-operational-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/INDONESIA_HEALTH_RECEIPT.json
          retention-days: 21
          if-no-files-found: warn

name: Analysis capacity offline candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/admission.py'
      - 'analysis/analyzer.py'
      - 'analysis/pricing.py'
      - 'core/analysis_plan.py'
      - 'pipeline.py'
      - 'storage/db.py'
      - 'scripts/analysis_capacity.py'
      - 'scripts/operations_center*.py'
      - 'tests/test_analysis*.py'
      - 'tests/integration/test_analysis_capacity.py'
      - 'docs/ANALYSIS_CAPACITY_RUNBOOK.md'
      - '.github/workflows/analysis_capacity_contracts.yml'

permissions:
  contents: read

concurrency:
  group: analysis-capacity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The ordinary PR gate intentionally skips drafts. This candidate needs full
# offline evidence while remaining draft; never dispatch Daily to obtain it.
jobs:
  offline-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Pin protected state
        run: |
          sha256sum pla_watch.db .github/state/llm_usage.jsonl > /tmp/ipr-protected.sha256
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Install declared dependencies and browser
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - name: Prove browser launches
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              print(browser.version)
              browser.close()
          PY
      - name: Full offline suite
        run: python -m unittest discover -s tests -t . -v
      - name: Governed output validation
        run: python scripts/validate_output.py
      - name: Protected state unchanged
        if: ${{ !cancelled() }}
        run: |
          sha256sum -c /tmp/ipr-protected.sha256
          git diff --exit-code -- pla_watch.db output/ .github/state/llm_usage.jsonl
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/ .github/state/llm_usage.jsonl)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

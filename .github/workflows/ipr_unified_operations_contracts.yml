name: Unified Operations Center offline contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/operations_center_unified.py'
      - 'scripts/operations_center.py'
      - 'tests/test_operations_center_unified.py'
      - 'docs/IPR_UNIFIED_OPERATIONS_CENTER.md'
      - '.github/workflows/ipr_unified_operations_contracts.yml'

permissions:
  contents: read

jobs:
  offline-unified:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Record tracked production database baseline
        id: baseline
        run: |
          echo "db=$(sha256sum pla_watch.db | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Install standard dependencies
        run: pip install -r requirements.txt
      - name: Verify unified production, shadow and Daily evidence integration
        run: |
          python -m unittest tests.test_operations_center_unified -v
          python -m unittest tests.test_analysis_queue_source_audit -v
          python -m unittest tests.test_operations_center -v
          python -m unittest tests.test_operations_center_shadow_overlay -v
          python -m unittest tests.test_daily_run_receipts -v
      - name: Smoke unified snapshot against real tracked production database
        run: |
          set -euo pipefail
          python scripts/operations_center_unified.py \
            --html "$RUNNER_TEMP/ipr-unified-real.html" \
            --json "$RUNNER_TEMP/ipr-unified-real.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          snapshot = json.loads((root / "ipr-unified-real.json").read_text())
          html = (root / "ipr-unified-real.html").read_text()
          assert snapshot["schema"] == "ipr-operations-snapshot/1"
          assert snapshot["shadow_evidence_overlay"]["schema"]
          assert snapshot["shadow_evidence_overlay"]["collection_verified"] is False
          assert snapshot["publication_authorized"] is False
          assert snapshot["editor_delivery_authorized"] is False
          assert snapshot["shadow_promotion_authorized"] is False
          assert "daily_actions_evidence" not in snapshot
          assert "Operations Center" in html
          assert "Shadow collection evidence candidates" in html
          print("Read-only real-DB unified snapshot passed")
          PY
      - name: Smoke pinned analysis queue overlay against real tracked SQLite
        run: |
          set -euo pipefail
          python scripts/operations_center_unified.py \
            --include-analysis-queue \
            --html "$RUNNER_TEMP/ipr-unified-queue-real.html" \
            --json "$RUNNER_TEMP/ipr-unified-queue-real.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((root / "ipr-unified-queue-real.json").read_text())
          html = (root / "ipr-unified-queue-real.html").read_text()
          queue = report["stored_analysis_queue_evidence"]
          assert queue["schema"] == "ipr-operations-stored-queue-evidence/1"
          assert queue["article_rows"] == sum(x["rows_total"] for x in queue["sources"])
          assert queue["stored_daily_queue_eligible"] == sum(
              x["daily_eligible_stored"] for x in queue["sources"])
          assert queue["stored_held_out_of_daily"] == sum(
              x["held_out_stored"] for x in queue["sources"])
          assert len(queue["input_file_sha256"]["db"]) == 64
          assert queue["model_spend_authorized"] is False
          assert queue["live_production_state_authenticated"] is False
          assert report["publication_authorized"] is False
          assert report["editor_delivery_authorized"] is False
          assert "Stored analysis queue" in html
          assert "NOT live production" in html
          print("Pinned, read-only analysis queue overlay passed")
          PY
      - name: Prove no tracked DB or published output changed
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        run: |
          test "$(sha256sum pla_watch.db | cut -d' ' -f1)" = "${{ steps.baseline.outputs.db }}"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

name: Next Desk Feasibility Probe

# Disposable research probe. Compares one Australia Defence route and one
# Taiwan MND English route from GitHub Actions before any desk engineering.
# Six GETs maximum: robots, listing, and one current article per candidate.
# No redirects, no linked documents, no repository/shadow/production writes.
on:
  pull_request:
    paths:
      - '.github/workflows/next_desk_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'research/next-desk-feasibility-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact probe head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install requests only
        run: python -m pip install 'requests>=2.31,<3'

      - name: Probe Australia and Taiwan official routes
        env:
          OUT: ${{ runner.temp }}/next-desk-probe.json
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          from urllib import robotparser

          import requests

          MAX_SAMPLE = 256 * 1024
          TIMEOUT = 20

          CANDIDATES = [
              {
                  "desk": "australia",
                  "robots": "https://www.defence.gov.au/robots.txt",
                  "listing": "https://www.defence.gov.au/news-events/releases",
                  "article": "https://www.defence.gov.au/news-events/releases/2026-10-07/adf-strengthens-regional-security-through-exercise-bersama-lima-2026",
              },
              {
                  "desk": "taiwan",
                  "robots": "https://www.mnd.gov.tw/robots.txt",
                  "listing": "https://www.mnd.gov.tw/en/news/PressReleaseList",
                  "article": "https://www.mnd.gov.tw/en/News/PressRelease/87935",
              },
          ]

          tree = ast.parse(Path("scraper/base.py").read_text(encoding="utf-8"))
          user_agent = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  getattr(t, "id", None) == "_USER_AGENT" for t in node.targets
              ):
                  user_agent = ast.literal_eval(node.value)
                  break
          if not user_agent:
              raise SystemExit("could not read _USER_AGENT")

          session = requests.Session()
          session.headers.update({
              "User-Agent": user_agent,
              "Accept": "text/plain,text/html,application/xhtml+xml;q=0.9,*/*;q=0.1",
          })

          def fetch(url):
              try:
                  resp = session.get(url, timeout=TIMEOUT, allow_redirects=False, stream=True)
                  chunks = []
                  total = 0
                  for chunk in resp.iter_content(16384):
                      if not chunk:
                          continue
                      remaining = MAX_SAMPLE - total
                      if remaining <= 0:
                          break
                      chunk = chunk[:remaining]
                      chunks.append(chunk)
                      total += len(chunk)
                      if total >= MAX_SAMPLE:
                          break
                  body = b"".join(chunks)
                  text = body.decode(resp.encoding or "utf-8", errors="replace")
                  return {
                      "url": url,
                      "status": resp.status_code,
                      "content_type": resp.headers.get("Content-Type"),
                      "location": resp.headers.get("Location"),
                      "server": resp.headers.get("Server"),
                      "cf_mitigated": resp.headers.get("Cf-Mitigated"),
                      "sample_bytes": len(body),
                      "sample_sha256": hashlib.sha256(body).hexdigest(),
                      "challenge_marker": bool(
                          resp.headers.get("Cf-Mitigated")
                          or re.search(r"cf-chl|challenge-platform|just a moment", text, re.I)
                      ),
                  }, text
              except requests.RequestException as exc:
                  return {
                      "url": url,
                      "transport_error": "%s: %s" % (type(exc).__name__, exc),
                  }, ""

          report = {
              "collector_user_agent": user_agent,
              "request_budget": 6,
              "redirects_followed": False,
              "linked_documents_fetched": False,
              "candidates": [],
          }

          for candidate in CANDIDATES:
              row = {"desk": candidate["desk"]}
              robots_meta, robots_text = fetch(candidate["robots"])
              row["robots"] = robots_meta
              readable = robots_meta.get("status") == 200 and bool(robots_text.strip())

              rp = robotparser.RobotFileParser()
              if readable:
                  rp.set_url(candidate["robots"])
                  rp.parse(robots_text.splitlines())

              for kind in ("listing", "article"):
                  url = candidate[kind]
                  allowed = bool(readable and rp.can_fetch(user_agent, url))
                  if not allowed:
                      row[kind] = {
                          "url": url,
                          "robots_allowed": False,
                          "request_made": False,
                      }
                      continue
                  meta, _ = fetch(url)
                  meta["robots_allowed"] = True
                  meta["request_made"] = True
                  row[kind] = meta
              report["candidates"].append(row)

          Path(os.environ["OUT"]).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload immutable probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-desk-feasibility-${{ github.run_id }}
          path: ${{ runner.temp }}/next-desk-probe.json
          if-no-files-found: error
          retention-days: 90

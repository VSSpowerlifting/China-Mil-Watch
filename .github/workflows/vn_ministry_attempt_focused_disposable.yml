# Disposable offline-only one-shot test, remove before review/merge
name: Vietnam ministry full daily calendar focused check
on:
  push:
    branches:
      - feat/vietnam-ministry-attempt-reconciliation-20261008
permissions:
  contents: read
jobs:
  focused:
    if: ${{ github.event.head_commit.message == 'Run complete Vietnam ministry calendar synthetic tests' && github.ref == 'refs/heads/feat/vietnam-ministry-attempt-reconciliation-20261008' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test attempt receipts and complete calendar contracts
        run: python -m unittest tests.test_vietnam_ministry_attempt_reconciliation -v

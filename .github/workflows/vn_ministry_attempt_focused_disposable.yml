# Disposable focused proof. Remove after this synthetic check.
name: Vietnam ministry attempt reconciliation focused tests
on:
  push:
    branches:
      - feat/vietnam-ministry-attempt-reconciliation-20261008
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event.head_commit.message == 'Run isolated ministry attempt reconciliation tests' && github.ref == 'refs/heads/feat/vietnam-ministry-attempt-reconciliation-20261008' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run pure offline synthetic attempts tests
        run: python -m unittest tests.test_vietnam_ministry_attempt_reconciliation -v

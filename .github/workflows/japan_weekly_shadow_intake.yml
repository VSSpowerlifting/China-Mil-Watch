name: Japan MOD — Pinned Weekly Shadow Source Inventory (Read Only)

# An evidence candidate queue, NEVER automatic body/model input or promotion.
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/japan_weekly_shadow_intake.py
      - tests/test_japan_weekly_shadow_intake.py
      - .github/workflows/japan_weekly_shadow_intake.yml
      - docs/JAPAN_WEEKLY_SHADOW_INTAKE.md
  workflow_dispatch:
    inputs:
      state_commit:
        description: Exact 40-character immutable shadow/jp-mod commit
        required: true
        type: string
      reporting_saturday:
        description: Reporting Saturday YYYY-MM-DD
        required: true
        type: string
      as_of:
        description: Friday or Saturday YYYY-MM-DD source cutoff
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: japan-weekly-shadow-inventory-readonly
  cancel-in-progress: false

jobs:
  metadata-intake:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install declared collector test dependencies
        run: pip install -r requirements.txt
      - name: Verify 10 strict offline original-source contracts
        run: python -m unittest tests.test_japan_weekly_shadow_intake -v
      - name: Clone isolated Japan MOD source state read only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_STATE_SHA: ${{ inputs.state_commit }}
          REQUESTED_SATURDAY: ${{ inputs.reporting_saturday }}
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          set -euo pipefail
          git -c credential.helper= clone --single-branch --branch shadow/jp-mod \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$RUNNER_TEMP/jp-mod-state"
          cd "$RUNNER_TEMP/jp-mod-state"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            commit="$(git rev-parse HEAD)"
            saturday=2026-10-10
            cutoff=2026-10-08
          else
            commit="$REQUESTED_STATE_SHA"
            saturday="$REQUESTED_SATURDAY"
            cutoff="$REQUESTED_AS_OF"
          fi
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || exit 2
          git cat-file -e "$commit^{commit}"
          git merge-base --is-ancestor "$commit" refs/heads/shadow/jp-mod
          test "$(git ls-tree --name-only "$commit")" = state
          echo "PINNED_JP_STATE_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "JP_WEEK_END=$saturday" >> "$GITHUB_ENV"
          echo "JP_WEEK_CUTOFF=$cutoff" >> "$GITHUB_ENV"
      - name: Inspect exact SQLite Git blob, report uncollected gaps
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.japan_weekly_shadow_intake \
            --state-repo "$RUNNER_TEMP/jp-mod-state" \
            --state-commit "$PINNED_JP_STATE_COMMIT" \
            --week-ending "$JP_WEEK_END" --as-of "$JP_WEEK_CUTOFF" \
            --output "$RUNNER_TEMP/japan-weekly-source-intake.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "japan-weekly-source-intake.json").read_text())
          assert report["state_commit"] == os.environ["PINNED_JP_STATE_COMMIT"]
          assert report["known_publication_coverage_incomplete"] is True
          assert report["joint_staff_collected"] is False
          assert report["english_press_collected"] is False
          assert report["candidate_human_review_completed"] is False
          assert report["source_rights_approved"] is False
          assert report["eligible_for_automatic_model_drafting"] is False
          assert report["state_or_production_writes"] == 0
          print(json.dumps({
            "state_commit": report["state_commit"],
            "week_ending": report["reporting_saturday"],
            "candidate_metadata_records": report["current_week_text_records"],
            "known_unretrieved_counts": report["unretrieved_counts_by_reason"],
            "approved_for_model": False,
          }))
          PY
      - name: Retain metadata only (no Japanese original bodies or PDFs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-mod-weekly-source-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/japan-weekly-source-intake.json
          retention-days: 60
          if-no-files-found: warn
      - name: Assert production checkout untouched
        if: always()
        run: test -z "$(git status --porcelain)"
      # No daily collector, full PDF reuse, model prompt, source publication,
      # production DB write, Friday/Sunday editor email, or Git push.

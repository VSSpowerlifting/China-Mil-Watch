name: Korea owner-released original text page projection

on:
  pull_request:
    paths:
      - core/korea_published_originals.py
      - research/korea_published_original_texts.json
      - site/preview/generate_preview.py
      - site/preview/templates/desk.html
      - site/preview/templates/korea-original.html
      - scripts/verify_korea_original_deployed_readback.py
      - tests/test_korea_published_originals.py
      - .github/workflows/korea_original_text_renderer_contracts.yml

permissions:
  contents: read

jobs:
  korea-original-text-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install beautifulsoup4 requests
      - name: Test empty public registry and exact text-only page render contracts
        run: python -m unittest -v tests.test_korea_published_originals
      - name: Prove already approved Korean sources remain exactly registered
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from core.korea_published_originals import read_release_index, render_original_body
          rows = read_release_index()
          observed = list(Path("research/korea_published_original_texts").glob("*.txt"))
          assert len(rows) == len(observed)
          for row in rows:
              ident = row["news_id"]
              expected = render_original_body(row)
              page = Path("output/korea-originals") / (ident + ".html")
              if page.is_file():
                  assert page.read_text(encoding="utf-8").count(expected) == 1
          print("Previously approved Korean originals preserved:", len(rows))
          PY
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"

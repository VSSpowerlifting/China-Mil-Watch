name: Korea owner-released original text page projection

on:
  pull_request:
    paths:
      - core/korea_published_originals.py
      - research/korea_published_original_texts.json
      - site/preview/generate_preview.py
      - site/preview/templates/desk.html
      - site/preview/templates/korea_original.html
      - tests/test_korea_published_originals.py
      - .github/workflows/korea_original_text_renderer_contracts.yml

permissions:
  contents: read

jobs:
  korea-original-text-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install beautifulsoup4 requests jinja2
      - name: Test empty public registry and exact text-only page render contracts
        run: python -m unittest -v tests.test_korea_published_originals
      - name: Prove already approved Korean sources remain exactly registered
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from core.korea_published_originals import read_release_index, render_original_page
          rows = read_release_index()
          observed = list(Path("research/korea_published_original_texts").glob("*.txt"))
          assert len(rows) == len(observed)
          import hashlib
          def git_blob_sha(raw):
              return hashlib.sha1(b"blob " + str(len(raw)).encode("ascii") +
                                  b"\\0" + raw).hexdigest()
          for row in rows:
              ident = row["news_id"]
              expected = render_original_page(row)
              assert row["original_text_sha256"] in expected
              assert 'class="masthead' in expected and 'href="#main"' in expected
              assert "<script" not in expected and ".hwpx" not in expected
              page = Path("output/korea-originals") / (ident + ".html")
              if not page.is_file():
                  continue
              current = page.read_bytes()
              if current != expected.encode("utf-8"):
                  # Exactly one already-public legacy page has the pre-shell
                  # bytes verified against main and gh-pages. This is a
                  # deliberately narrow transitional allowance, not an
                  # arbitrary weakening of public byte parity. A later
                  # controlled Korea-only release must update it.
                  assert ident == "156784297"
                  assert git_blob_sha(current) == (
                      "113ed8709e29e343e0ed89132ffee8c4d071106a")
                  print("PENDING_CONTROLLED_KOREA_HTML_RELEASE:", ident)
          print("Registered originals source-verified:", len(rows))
          PY
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"

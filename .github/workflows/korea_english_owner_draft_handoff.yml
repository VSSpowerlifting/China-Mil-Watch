name: Korea — Private English translation and analysis owner handoff

# Privately draft newly published original Korean government texts, never
# publish machine analysis and never send the drafts to editorial staff.
on:
  # Rehearse the first owner-only handoff immediately upon activation.
  push:
    branches: [main]
    paths:
      - .github/workflows/korea_english_owner_draft_handoff.yml
      - scripts/send_korea_english_owner_drafts.py
      - scripts/draft_korea_english_analysis.py
  pull_request:
    paths:
      - scripts/draft_korea_english_analysis.py
      - scripts/send_korea_english_owner_drafts.py
      - tests/test_korea_english_publication.py
      - tests/test_korea_english_owner_draft_handoff.py
      - tests/test_korea_owner_handoff_recovery_contract.py
      - scripts/verify_korea_original_deployed_readback.py
      - research/korea_english_draft_handoff_receipts.json
      - .github/workflows/korea_english_owner_draft_handoff.yml
  # An owner-approved source release can commit exact originals and Pages,
  # then fail only its terminal HTTPS cache/readback step. GitHub marks that
  # workflow red and previously skipped the owner draft handoff altogether.
  # A failed upstream run is NOT publication proof: a new independent
  # main -> gh-pages -> HTTPS readback below must pass before ANY model call.
  workflow_run:
    workflows:
      - Korea — Standing-Licensed Original Text to Live Pages
    types: [completed]
  schedule:
    - cron: '43 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipr-korea-english-private-owner-handoff
  cancel-in-progress: false

jobs:
  draft-unit-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements.txt
      - name: Prove no-repeat private owner-email delivery and unreviewed-only drafts
        run: >-
          python -m unittest -v
          tests.test_korea_english_publication
          tests.test_korea_english_owner_draft_handoff
          tests.test_korea_original_deployed_readback
          tests.test_korea_owner_handoff_recovery_contract

  send-unreviewed-korea-drafts-to-owner:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.conclusion == 'success' ||
         github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify owner-only credentials configured without logging secrets
        id: credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IPR_PREVIEW_TO: ${{ secrets.IPR_PREVIEW_TO }}
          IPR_EDITOR_TO: ${{ secrets.IPR_EDITOR_TO }}
          IPR_SMTP_USER: ${{ secrets.IPR_SMTP_USER }}
          IPR_SMTP_APP_PASSWORD: ${{ secrets.IPR_SMTP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$IPR_PREVIEW_TO" ] && \
             [ -n "$IPR_EDITOR_TO" ] && [ -n "$IPR_SMTP_USER" ] && \
             [ -n "$IPR_SMTP_APP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Owner-only private draft configuration detected"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "HOLD: missing owner-only model or SMTP configuration; no send"
          fi
      - name: Install Anthropic and exact-source validators
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt
      - name: Select published originals without delivered/reviewed English
        id: pending
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts.send_korea_english_owner_drafts import pending
          selected, _ = pending()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("has_pending=" + ("true" if selected else "false") + "\n")
          print("Pending published originals eligible for private owner review:", len(selected))
          PY
      - name: Read existing Pages branch without publish credentials
        if: steps.pending.outputs.has_pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --single-branch --branch gh-pages \
            https://github.com/VSSpowerlifting/IndoPacificRecord.git \
            "$RUNNER_TEMP/korea-owner-draft-pages"
      - name: Independently prove source and desk are live over exact HTTPS
        id: public_readback
        if: steps.pending.outputs.has_pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.verify_korea_original_deployed_readback \
            --main-checkout . --pages-checkout "$RUNNER_TEMP/korea-owner-draft-pages" \
            --require-https-readback --attempts 8
          # A green upstream job is insufficient; original source bytes,
          # main/gh-pages parity and live HTTP must all be proved again.
          git diff --exit-code -- pla_watch.db output/ \
            research/korea_published_original_texts.json \
            research/korea_published_original_texts
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Generate bounded English and analytical drafts and send to owner only
        id: draft
        continue-on-error: true
        if: >-
          steps.credentials.outputs.ready == 'true' &&
          steps.pending.outputs.has_pending == 'true' &&
          steps.public_readback.outcome == 'success'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IPR_PREVIEW_TO: ${{ secrets.IPR_PREVIEW_TO }}
          IPR_EDITOR_TO: ${{ secrets.IPR_EDITOR_TO }}
          IPR_SMTP_USER: ${{ secrets.IPR_SMTP_USER }}
          IPR_SMTP_APP_PASSWORD: ${{ secrets.IPR_SMTP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          python -m scripts.send_korea_english_owner_drafts \
            --send-owner-only-unreviewed
      - name: Commit only source SHA-delivery receipts, never model content
        # A second draft can HOLD after the first email was delivered. Persist
        # that first delivery receipt even when the draft step failed, or the
        # next scheduled retry would send a duplicate private email.
        if: always() && steps.credentials.outputs.ready == 'true' && steps.draft.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          git add -- research/korea_english_draft_handoff_receipts.json
          staged="$(git diff --cached --name-only)"
          test -z "$staged" || test "$staged" = "research/korea_english_draft_handoff_receipts.json"
          if [ -n "$staged" ]; then
            before="$(git rev-parse HEAD)"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$before" || {
              echo "::error::Main changed; refuse to replace another review receipt"
              exit 1
            }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Korea: record private English draft owner-delivery SHA only"
            git push origin HEAD:main
          fi
          git diff --exit-code -- pla_watch.db output/ research/korea_english_publications.json
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Preserve failed private-draft status after receipt persistence
        if: always() && steps.draft.outcome == 'failure'
        run: |
          echo '::error::Korea private draft HOLD; any successful earlier delivery receipt was preserved'
          exit 1

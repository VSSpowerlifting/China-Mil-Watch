name: Standing Japan MOD and KOGL Type 1 Text Rights

# Test-only: no source fetch, no reviewer credential, no DB writes, no Pages.
on:
  pull_request:
    paths:
      - core/standing_source_rights.py
      - tests/test_standing_source_rights.py
      - docs/engineering/STANDING_TEXT_REUSE_FAST_LANE_2026-10-15.md
      - .github/workflows/standing_source_rights_contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standing-license-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check licensed text fast lane and prevent publisher exceptions bypass
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest \
            tests.test_standing_source_rights \
            tests.test_license_and_rights_scope -v
      - name: Confirm no production files or source shadows were changed
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ shadow/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/ shadow/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

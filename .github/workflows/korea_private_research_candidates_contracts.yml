name: Korea Week-42 staged source notes — offline no-send contracts

# This is a source-identity checker, not the Sunday writer. It cannot send
# an email, call a model, access Korea Policy Briefing or update public sites.
on:
  pull_request:
    paths:
      - core/korea_private_research_candidates.py
      - scripts/check_korea_private_research_candidates.py
      - tests/test_korea_private_research_candidates.py
      - research/korea/private_research_candidates/**
      - .github/workflows/korea_private_research_candidates_contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-source-bounded-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Recheck closed list, source versions, date and no-send gates
        run: python -m unittest tests.test_korea_private_research_candidates -v
      - name: Inspect safe metadata-only candidate receipt
        run: python -m scripts.check_korea_private_research_candidates --week-ending 2026-10-17 --as-of 2026-10-17
      - name: Verify repository and production unmodified
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ research/ scripts/ core/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

# Neither the generated receipt nor the source-original bodies are uploaded.
# All source rights, model-use and publication approval fields stay false.

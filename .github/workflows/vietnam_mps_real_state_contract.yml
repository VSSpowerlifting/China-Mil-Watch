name: Vietnam MPS Read-Only Real-State Contract

# First-party Git shadow proof for the feeder. Unlike the large repo suite,
# this runs the *real historical isolated state* against pinned source
# version metadata, without an Anthropic model, email, deployment or artifact.
on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/prepare_vietnam_briefs_evidence.py"
      - "scripts/build_vietnam_sunday_packet.py"
      - "research/vietnam_briefs_candidates/editorial_notes_2026-10-10.json"
      - ".github/actions/vietnam-editorial-evidence/**"
      - ".github/workflows/vietnam_mps_real_state_contract.yml"
      - "tests/test_vietnam_briefs_evidence_feeder.py"

permissions:
  contents: read

concurrency:
  group: vietnam-mps-real-state-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shadow-contract:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge tree, no repository write token
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install only project dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate actual immutable Vietnam MPS shadow bytes
        id: vietnam
        uses: ./.github/actions/vietnam-editorial-evidence
        with:
          week-ending: "2026-10-10"
          state-commit: "46f6a0e59e25b03868bf7ad600963d6921ee5124"
          notes: "research/vietnam_briefs_candidates/editorial_notes_2026-10-10.json"

      - name: Assert exactly two Oct 5 source-backed candidates; never approve
        env:
          PRIVATE_PACKET: ${{ steps.vietnam.outputs.packet }}
          HISTORICAL_SHA: ${{ steps.vietnam.outputs.source-commit }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          packet=json.loads(Path(os.environ["PRIVATE_PACKET"]).read_text())
          assert packet["week_ending"]=="2026-10-10"
          assert os.environ["HISTORICAL_SHA"]=="46f6a0e59e25b03868bf7ad600963d6921ee5124"
          rows=packet["items"]
          assert {x["id"] for x in rows} == {
              "VN-MPS-1791199100", "VN-MPS-1791199677",
          }
          assert all(x["status"]=="unapproved-source-linked-editorial-candidate"
                     and x["copy_scope"]=="private-model-drafting-only-no-source-body"
                     and x["hash_rule"]=="mps-vi-content-v1"
                     for x in rows)
          assert not any("text_original" in x or "article_body" in x for x in rows)
          print("Verified 2 unapproved Vietnamese publisher references from immutable shadow state.")
          print("No mail, model, output database mutation, public article body, or publication.")
          PY

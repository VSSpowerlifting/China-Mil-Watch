name: Sunday source coverage — read-only default ranking contracts

# No production corpus selection override, collector, model call or SMTP.
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/audit_sunday_source_cover.py
      - tests/test_audit_sunday_source_cover.py
      - .github/workflows/sunday_source_cover_audit.yml

permissions:
  contents: read

jobs:
  observer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run actual default-selection observer using synthetic data only
        run: python -m unittest tests.test_audit_sunday_source_cover -v
      - name: Source, database and output must remain unchanged
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

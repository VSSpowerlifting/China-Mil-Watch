name: Japan archived vs current MOD source row drift checks

on:
  pull_request:
    branches: [main]
    paths:
      - core/japan_shadow_source_row_drift.py
      - scripts/japan_shadow_source_row_drift.py
      - tests/test_japan_shadow_source_row_drift.py
      - docs/JAPAN_SHADOW_SOURCE_ROW_DRIFT.md
      - .github/workflows/japan_shadow_source_row_drift.yml

permissions:
  contents: read

concurrency:
  group: japan-shadow-source-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  no-send-row-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Baseline published archive
        id: archive
        run: echo "sha=$(sha256sum pla_watch.db | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Install offline requirements
        run: python -m pip install -r requirements.txt
      - name: Test exact historical row and shadow Git lineage with no network
        run: |
          python -m unittest -v \
            tests.test_japan_shadow_source_row_drift \
            tests.test_japan_sunday_source_attestation \
            tests.test_japan_oct05_brief_source
      - name: Check no model, email, publisher fetch or auto-release hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          text = (Path("core/japan_shadow_source_row_drift.py").read_text()
                  + Path("scripts/japan_shadow_source_row_drift.py").read_text())
          wf = Path(".github/workflows/japan_shadow_source_row_drift.yml").read_text()
          assert "ANTHROPIC_API_KEY" not in text
          assert "smtplib" not in text
          assert "send_packet(" not in text
          assert "requests.get(" not in text
          assert "  " + "schedule:" not in wf
          assert "actions/" + "upload-artifact" not in wf
          assert '"publication_authorized": False' in text
          assert "O_EXCL" in text
          print("Only historical/current archived source comparison; zero release authority")
          PY
      - name: Preserve main SQLite and generated site
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$(sha256sum pla_watch.db | cut -d' ' -f1)" = "${{ steps.archive.outputs.sha }}"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

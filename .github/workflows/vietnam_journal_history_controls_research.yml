# One-shot journal historical-navigation research (#154); DO NOT MERGE.
# URL budget: robots.txt + four desktop English category first pages +
# one publisher-exposed "Defence" keyword results page.
# No schedule, extra page clicks, article requests, DB, publisher text or IDs.
# Exact commit-message guard prevents repeated live requests on subsequent pushes.
name: Vietnam journal historical controls one-shot research
on:
  push:
    branches: [research/vietnam-journal-history-controls-20261008]
permissions:
  contents: read
jobs:
  research-only:
    if: ${{ github.ref == 'refs/heads/research/vietnam-journal-history-controls-20261008' && github.event.head_commit.message == 'Trigger tested one-shot Vietnam journal navigation proof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout unmerged research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install narrow research dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Synthetic tests; zero network
        run: python -m unittest tests.test_vietnam_journal_history_controls -v
      - name: Six bounded GETs, robots plus categories and keyword page
        env:
          REPORT: ${{ runner.temp }}/vietnam-journal-history-controls.json
        run: |
          python -m scripts.research_vietnam_journal_history_controls
      - name: Upload structural metadata only; no publisher bytes/IDs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vietnam-journal-history-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/vietnam-journal-history-controls.json
          if-no-files-found: error
          retention-days: 14

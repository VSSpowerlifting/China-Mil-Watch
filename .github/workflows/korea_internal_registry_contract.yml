name: Korea Desk — internal shadow registry does not publish

on:
  pull_request:
    paths:
      - "desks/registry.json"
      - "core/desk_registry.py"
      - "tests/test_korea_internal_registry.py"
      - ".github/workflows/korea_internal_registry_contract.yml"

permissions:
  contents: read

jobs:
  internal-only-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Preserve tracked production and output checksums
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > /tmp/korea-roster-db.sha
          find output -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/korea-roster-output.sha
      - name: Install offline site-builder dependencies
        run: python -m pip install -r requirements.txt
      - name: Korea governance and public site nonpublication
        run: |
          python -m unittest tests.test_korea_internal_registry tests.test_desk_rollout_contract -q
      - name: Confirm no production, output, source or shadow state mutation
        run: |
          set -euo pipefail
          sha256sum -c /tmp/korea-roster-db.sha
          sha256sum -c /tmp/korea-roster-output.sha > /dev/null
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/ shadow/)"

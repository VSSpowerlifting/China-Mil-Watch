name: Temporary Wave10 Wei Fenghe review image acquisition
on:
  push:
    branches: [editorial/briefs-photo-wave10-no01-20261014]
    paths:
      - .github/workflows/temp_briefs_photo_wave10_no01_review.yml
      - scripts/stage_briefs_photo_wave10_no01.py
permissions:
  contents: write
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image encoder
        run: |
          python -m pip install -r requirements.txt
          python -m pip install Pillow==11.3.0
      - name: Acquire exact original and derive review-only 720x480 crop
        run: |
          python scripts/stage_briefs_photo_wave10_no01.py
          python -m unittest tests.test_catalogue_media -q
          git diff --exit-code -- site/assets/catalogue/admissions.json site/assets/editorial/manifest.json output/analysis.html pla_watch.db
      - name: Commit precisely review images and source receipt, never Pages
        run: |
          set -euo pipefail
          git add -- docs/engineering/photo_review/no-01-wei-fenghe-2018-original.jpg
          git add -- docs/engineering/photo_review/no-01-wei-fenghe-2018-card.jpg
          git add -- docs/engineering/BRIEFS_PHOTO_WAVE10_NO01_WEI_REVIEW_2026-10-14.md
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+41898282@users.noreply.github.com"
          git commit -m "Wave10: add checksum-verified Wei Fenghe owner-only crop, No1 hold intact"
          git push origin HEAD:editorial/briefs-photo-wave10-no01-20261014

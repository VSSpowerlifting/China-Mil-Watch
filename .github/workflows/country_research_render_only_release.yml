name: Country research desks — render-only release

# Release of approved *site presentation* only. No publisher traffic, collector,
# private source-state fetch, analysis model, or DB promotion.
on:
  pull_request:
    paths:
      - ".github/workflows/country_research_render_only_release.yml"
      - "tests/test_country_research_release_contract.py"
      - "core/public_editorial_research.py"
      - "research/approved_desk_research.json"
      - "scripts/guard_public_editorial_research.py"
      - "tests/test_public_editorial_research.py"
      - "tests/test_public_editorial_render_gate.py"
      - "site/preview/templates/desk.html"
      - "site/preview/templates/desks.html"
      - "site/preview/generate_preview.py"
      - "scripts/guard_country_research_output_scope.py"
      - "tests/test_country_research_output_scope.py"
      - "scripts/stage_country_research_output.py"
      - "tests/test_stage_country_research_output.py"
      - "scripts/guard_japan_official_reference_release.py"
      - "tests/test_guard_japan_official_reference_release.py"
  # A reviewed merge of the publication catalog/contract may release the
  # independently approved *editorial presentation* automatically on main.
  # No collection, source-text mirrors, or new brief approval happens here.
  push:
    branches: [main]
    paths:
      - ".github/workflows/country_research_render_only_release.yml"
      - "research/approved_desk_research.json"
  workflow_dispatch:
    inputs:
      approved_main_sha:
        description: "Exact 40-character main commit reviewed for public country pages"
        required: true
        type: string
      publish:
        description: "Publish regenerated output to main and GitHub Pages (otherwise preview only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify explicit release invariants and staging boundaries
        run: |
          python -m unittest tests.test_country_research_release_contract tests.test_stage_country_research_output tests.test_guard_japan_official_reference_release -v
          python -m unittest tests.test_public_editorial_research tests.test_public_editorial_render_gate -v
      - name: Install existing render dependencies (no publisher calls)
        run: pip install -r requirements.txt
      - name: Exercise actual static release build without committing or deploying
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > /tmp/ipr-release-ci-db.sha
          python site/render.py --out "$RUNNER_TEMP/country-render"
          python -m scripts.stage_country_research_output --from-dir "$RUNNER_TEMP/country-render" --to-dir output
          python -m scripts.guard_japan_official_reference_release
          python -m scripts.guard_public_editorial_research --root output
          python scripts/validate_output.py
          python -m scripts.guard_country_research_output_scope
          test -f output/philippines.html
          test -f output/vietnam.html
          test -f output/indonesia.html
          test -f output/japan.html
          test -f output/desk-references.js
          sha256sum -c /tmp/ipr-release-ci-db.sha
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
          git diff --exit-code -- pla_watch.db

      - name: Retain permanent editorial country pages for independent preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ipr-permanent-editorial-review-${{ github.run_id }}
          path: |
            output/vietnam.html
            output/desks.html
          if-no-files-found: error
          retention-days: 3

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: daily-update
      cancel-in-progress: false
    steps:
      - name: Checkout exact current main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Fail closed on stale or malformed owner-reviewed SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.approved_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Expected a full lowercase SHA"; exit 1; }
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "::error::Main moved since release review. Actual: $ACTUAL_SHA"; exit 1;
          }
          echo "Releasing reviewed main: $ACTUAL_SHA ($GITHUB_EVENT_NAME)"
          sha256sum pla_watch.db > "$RUNNER_TEMP/country-release-db.sha"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/country-release-before.txt"
          test ! -s "$RUNNER_TEMP/country-release-before.txt"

      - name: Install render dependencies (no external publisher requests)
        run: pip install -r requirements.txt

      - name: Confirm production DB current without modification
        run: |
          set -euo pipefail
          python scripts/verify_db_current.py
          sha256sum -c "$RUNNER_TEMP/country-release-db.sha"

      - name: Build isolated site and stage only reviewed country presentation
        run: |
          set -euo pipefail
          # Never replace the committed output tree with an unreviewed full-site build.
          # The full build stays in scratch; only seven explicitly reviewed files
          # are copied into output before the whole-tree validation/scope guard.
          python site/render.py --out "$RUNNER_TEMP/country-render"
          python -m scripts.stage_country_research_output --from-dir "$RUNNER_TEMP/country-render" --to-dir output
          python -m scripts.guard_japan_official_reference_release
          python -m scripts.guard_public_editorial_research --root output
          python scripts/validate_output.py

      - name: Country-desk public scope and metadata hold gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("output")
          reg = json.loads(Path("desks/registry.json").read_text(encoding="utf-8"))
          country = {x["slug"]: x for x in reg["desks"]}
          assert {"china", "singapore", "philippines", "vietnam", "indonesia"} <= country.keys()
          # A permanently publishing IPR editorial desk is NOT an admitted
          # source collector. Allow its approved research heading only when
          # the same catalog is independently authenticated by the render gate.
          from core.public_editorial_research import load_catalog
          editorial_desks = {entry["desk"] for entry in load_catalog()}
          for name in ("philippines", "vietnam", "indonesia"):
              d = country[name]
              assert d["public"] is True and d["status"] == "shadow"
              assert d["manifest"] is None and d["has_production_records"] is False
              text = (base / (name + ".html")).read_text(encoding="utf-8")
              if name in editorial_desks:
                  assert "IPR research published — official originals linked" in text
                  assert "not a production source-text archive" in text
              else:
                  assert "Shadow evaluation" in text
              assert "Individually reviewed official-source references" in text
              assert "No individual source references have completed" in text
              assert "data-reference-list" not in text
              assert "state/shadow.db" not in text
              assert "text_original" not in text and "body_original" not in text
          # Japan is a public research route, but its manifest is deliberately
          # SHADOW-only. It must not be treated as a production desk or as an
          # extension of the Vietnam/Indonesia reviewed-record mechanism.
          japan = country["japan"]
          assert japan["public"] is True and japan["status"] == "shadow"
          assert japan["manifest"] == "shadow/jp_mod/manifest.json"
          assert japan["has_production_records"] is False
          japan_html = (base / "japan.html").read_text(encoding="utf-8")
          assert "Shadow evaluation" in japan_html
          assert "not in corpus" in japan_html
          official_japan_indices = (
              "https://www.mod.go.jp/j/press/news/",
              "https://www.mod.go.jp/j/update/index.html",
              "https://www.kaiho.mlit.go.jp/e/topics_archive/index.html",
          )
          for url in official_japan_indices:
              assert 'href="' + url + '" rel="noopener noreferrer"' in japan_html
          assert japan_html.count("Open official publisher index") == 3
          assert "manual October 8 Day 0" in japan_html
          assert "repository gate was observed unset or unavailable" in japan_html
          assert "30 verified scheduled MOD collection slots" in japan_html
          for forbidden in ("data-reference-list", "state/shadow.db",
                            "text_original", "body_original"):
              assert forbidden not in japan_html
          assert 'href="archive.html?desk=japan"' not in japan_html
          indonesia = (base / "indonesia.html").read_text(encoding="utf-8")
          assert "No individual source references have completed" in indonesia
          assert "data-reference-list" not in indonesia
          assert "state/shadow.db" not in indonesia
          assert "text_original" not in indonesia and "body_original" not in indonesia
          for name in ("philippines", "vietnam"):
              row = json.loads((Path("research") / (name + "_reviewed_links.json")).read_text(encoding="utf-8"))
              assert row["entries"] == [], "nonempty source links need separate review and release"
          desk_html = (base / "desks.html").read_text(encoding="utf-8")
          assert 'href="philippines.html"' in desk_html
          assert 'href="vietnam.html"' in desk_html
          assert 'href="indonesia.html"' in desk_html
          assert "8 declared" in desk_html and "2 collecting" in desk_html
          assert (base / "desk-references.js").is_file()
          assert (base / "desk-references.css").is_file()
          assert (base / "sitemap.xml").is_file()
          PY
          sha256sum -c "$RUNNER_TEMP/country-release-db.sha"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
          git diff --exit-code -- pla_watch.db

      - name: Fail closed on unrelated staged or pre-existing generated drift
        run: |
          set -euo pipefail
          # Publishing this workflow deploys the entire ./output tree, so even
          # ignored or unstaged media must be scoped before the Pages action.
          python -m scripts.guard_country_research_output_scope

      - name: Stage only approved country research presentation files
        run: |
          set -euo pipefail
          git add -A -- output/philippines.html output/vietnam.html output/indonesia.html output/japan.html output/desks.html output/desk-references.js output/desk-references.css
          python -m scripts.guard_country_research_output_scope
          git diff --cached --name-status > "$RUNNER_TEMP/country-release-files.txt"
          echo "Generated site change count: $(wc -l < "$RUNNER_TEMP/country-release-files.txt")"
          head -n 45 "$RUNNER_TEMP/country-release-files.txt"
          test -s "$RUNNER_TEMP/country-release-files.txt" || {
            echo "::error::Nothing changed in output; refusing to assert a new release"; exit 1;
          }
          # Anything outside output or the source DB changing means an unexpected
          # side effect. Do not publish such a build.
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^([AMDRC ][AMDRC ]|[?][?]) output/' || true)"
          sha256sum -c "$RUNNER_TEMP/country-release-db.sha"

      - name: Upload small preview for review or release receipt
        uses: actions/upload-artifact@v4
        with:
          name: country-desk-render-preview
          path: |
            output/philippines.html
            output/vietnam.html
            output/indonesia.html
            output/japan.html
            output/desks.html
            output/desk-references.js
            output/desk-references.css
          retention-days: 7

      - name: Commit generated output to main only when publish is approved
        if: github.event_name == 'push' || inputs.publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A concurrent PR, release or DB save is a new review state.
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" || {
            echo "::error::main changed during render"; exit 1;
          }
          git commit -m "Site: render reviewed country research desks (metadata-only)"
          git push origin HEAD:main

      - name: Publish exact validated output to GitHub Pages
        if: github.event_name == 'push' || inputs.publish
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          cname: indopacificrecord.org
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy country research desks: ${{ github.run_id }}'

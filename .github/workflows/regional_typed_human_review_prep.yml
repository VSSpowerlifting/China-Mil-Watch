name: Regional typed human source review preparation checks

on:
  pull_request:
    branches: [main]
    paths:
      - core/regional_typed_human_review_prep.py
      - scripts/regional_typed_human_review_prep.py
      - tests/test_regional_typed_human_review_prep.py
      - docs/REGIONAL_TYPED_HUMAN_REVIEW_PREP.md
      - .github/workflows/regional_typed_human_review_prep.yml

permissions:
  contents: read

concurrency:
  group: regional-human-worksheet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unsigned-worksheet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Baseline tracked archive
        id: original
        run: echo "sha=$(sha256sum pla_watch.db | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt
      - name: Run private worksheet and existing regional hold contracts
        run: |
          python -m unittest -v \
            tests.test_regional_typed_human_review_prep \
            tests.test_regional_typed_research_holds \
            tests.test_briefs_editorial_evidence \
            tests.test_regional_weekly_inventory
      - name: Prove no hidden send, model or review signer
        run: |
          python - <<'PY'
          from pathlib import Path
          core = Path("core/regional_typed_human_review_prep.py").read_text()
          cli = Path("scripts/regional_typed_human_review_prep.py").read_text()
          wf = Path(".github/workflows/regional_typed_human_review_prep.yml").read_text()
          assert "ANTHROPIC_API_KEY" not in core + cli
          assert "smtplib" not in core + cli
          assert "send_packet(" not in core + cli
          assert "  " + "schedule:" not in wf
          assert "actions/" + "upload-artifact" not in wf
          assert '"model_input_authorized": False' in core
          assert '"publication_authorized": False' in core
          assert "O_EXCL" in cli
          print("Unsigned human review preparation only; no granted permissions")
          PY
      - name: Confirm archive and generated site untouched
        if: ${{ !cancelled() && steps.original.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$(sha256sum pla_watch.db | cut -d' ' -f1)" = "${{ steps.original.outputs.sha }}"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

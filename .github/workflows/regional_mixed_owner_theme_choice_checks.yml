name: Owner-signed mixed thematic focus - offline only

on:
  pull_request:
    branches:
      - main
      - feat/regional-mixed-theme-owner-approved-model-20261009
    paths:
      - core/regional_mixed_theme_choice.py
      - tests/test_regional_mixed_theme_choice.py
      - docs/REGIONAL_MIXED_OWNER_THEME_CHOICE.md
      - .github/workflows/regional_mixed_owner_theme_choice_checks.yml

permissions:
  contents: read

jobs:
  offline-owner-theme-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Record database checksum
        run: sha256sum pla_watch.db > "$RUNNER_TEMP/mixed-theme-choice-db.sha"
      - name: Install pinned project requirements
        run: python -m pip install -r requirements.txt
      - name: Owner theme and historical source boundary regression suite
        run: |
          python -m unittest -v \
            tests.test_regional_mixed_theme_choice \
            tests.test_regional_mixed_theme_selector \
            tests.test_regional_reviewed_typed_slate \
            tests.test_regional_typed_source_use_decision \
            tests.test_regional_sunday_theme_handoff
      - name: Refuse provider, delivery, model, publisher fetch and site writes
        run: |
          python - <<'PY'
          from pathlib import Path
          body = Path("core/regional_mixed_theme_choice.py").read_text()
          workflow = Path(
              ".github/workflows/regional_mixed_owner_theme_choice_checks.yml"
          ).read_text()
          for forbidden in ("smtplib", "ANTHROPIC_API_KEY", "OPENAI_API_KEY",
                            "requests.get(", "requests.post(", "urllib.request",
                            "send_packet(", "model_tool(", "subprocess."):
              assert forbidden not in body, forbidden
          for marker in ("hmac.compare_digest", "owner_confirms_focus is True",
                         "private_manuscript_model_authorized",
                         "publication_authorized"):
              assert marker in body
          assert ("  " + "schedule:") not in workflow
          assert "upload" + "-artifact" not in workflow
          PY
      - name: Database and publication remain byte-preserved
        if: always()
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/mixed-theme-choice-db.sha"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

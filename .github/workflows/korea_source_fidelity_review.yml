name: South Korea HWPX Source-Fidelity Review (Manual)

# Human editorial/rights approval is never generated by this workflow.
# Output contains only publisher metadata, integrity outcomes, and blank checks.
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Optional UTC review cutoff (YYYY-MM-DD); blank means current UTC day'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: korea-shadow-fidelity-review
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewer only
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: python -m pip install -r repo/requirements.txt

      - name: Run offline Korea fidelity regressions
        working-directory: repo
        run: python -m unittest tests.test_korea_source_fidelity tests.test_indonesia_korea_shadow -q

      - name: Read exact Korean shadow branch and prepare private reviewer packet
        env:
          STATE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          INPUT_AS_OF: ${{ inputs.as_of }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --single-branch --branch shadow/korea-policy-briefing \
            "$STATE_REMOTE" "$RUNNER_TEMP/korea-state"
          test "$(git -C "$RUNNER_TEMP/korea-state" branch --show-current)" = "shadow/korea-policy-briefing"
          test "$(git -C "$RUNNER_TEMP/korea-state" ls-tree --name-only HEAD)" = "state"
          as_of="$INPUT_AS_OF"
          if [[ -z "$as_of" ]]; then
            as_of="$(date -u +%F)"
          fi
          tip="$(git -C "$RUNNER_TEMP/korea-state" rev-parse HEAD)"
          python -m scripts.audit_korea_source_fidelity \
            --state-repo "$RUNNER_TEMP/korea-state" \
            --state-commit "$tip" \
            --as-of "$as_of" \
            --out "$RUNNER_TEMP/korea-source-review"
          test -z "$(git -C "$RUNNER_TEMP/korea-state" status --porcelain --untracked-files=all)"
          test -z "$(git -C repo status --porcelain --untracked-files=all)"

      - name: Preserve machine-only review packet for actual human source comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korea-hwpx-source-fidelity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/korea-source-review/
          if-no-files-found: warn
          retention-days: 30

      # Never commit, merge, email, call an LLM, approve, promote or deploy.

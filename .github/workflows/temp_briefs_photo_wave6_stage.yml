name: Temporary Wave 6 CC0 Jiangnan Shipyard photo staging
on:
  push:
    branches: [editorial/briefs-photo-wave6-20261013]
    paths:
      - .github/workflows/temp_briefs_photo_wave6_stage.yml
      - scripts/stage_briefs_photo_wave6.py
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unchanged publication requirements and exact photo encoder
        run: |
          python -m pip install -r requirements.txt
          python -m pip install Pillow==11.3.0
      - name: Acquire author-owned Commons CC0 image and pin original source
        run: |
          python scripts/stage_briefs_photo_wave6.py
          python scripts/build_catalogue_media.py --check
          python -m unittest tests.test_catalogue_media -v
      - name: Render isolated 18-issue catalogue and test historical disclaimer
        run: |
          set -euo pipefail
          python site/render.py --out "$RUNNER_TEMP/wave6-render"
          python - "$RUNNER_TEMP/wave6-render" <<'PY'
          import sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path(sys.argv[1])
          doc=BeautifulSoup((root/"analysis.html").read_text(),"html.parser")
          cards=doc.select("article.brief-card")
          photos=[c for c in cards if c.get("data-media")=="photograph"]
          assert len(cards)==18,len(cards)
          assert len(photos)==11,len(photos)
          no2=next(c for c in cards if c.select_one(".issue-no") and
              c.select_one(".issue-no").get_text(strip=True)=="No. 2")
          image=no2.select_one("img")
          assert image and "jiangnan-shipyard-fujian-context-2022" in image["src"]
          assert (root/image["src"]).is_file()
          description=no2.get_text(" ",strip=True)
          for term in ["Jiangnan Shipyard","April 2022","KJ-600","not a photograph",
                       "Raysonho","Meeepmep","CC0 1.0"]:
              assert term in description,term
          assert "Benjamin Yang and Dylan Tanzi" in (root/"briefs/what-is-being-built-in-laos.html").read_text()
          print("Render: 18 issues/11 photography cards; No2 CC0 original, historical context, coauthors intact")
          PY
      - name: Stage source and exactly two changed output routes without publishing
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/wave6-render/analysis.html" output/analysis.html
          cp "$RUNNER_TEMP/wave6-render/assets/catalogue/media/no-02-jiangnan-shipyard-fujian-context-2022.jpg" output/assets/catalogue/media/no-02-jiangnan-shipyard-fujian-context-2022.jpg
          git add -- site/assets/editorial/manifest.json site/assets/catalogue/admissions.json
          git add -- site/assets/editorial/jiangnan-shipyard-fujian-context-2022.jpg
          git add -- site/assets/editorial/derivatives/jiangnan-shipyard-fujian-context-2022-1600.jpg
          git add -- site/assets/catalogue/media/no-02-jiangnan-shipyard-fujian-context-2022.jpg
          git add -- output/analysis.html output/assets/catalogue/media/no-02-jiangnan-shipyard-fujian-context-2022.jpg
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --exit-code -- pla_watch.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+41898282@users.noreply.github.com"
          git commit -m "Briefs: stage CC0 Jiangnan shipyard context photo for Fujian No2"
          git push origin HEAD:editorial/briefs-photo-wave6-20261013

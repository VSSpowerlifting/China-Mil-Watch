name: Vietnam Ministry Shadow Collection

# Prepared only. Owner approval of visibility, identity and dispatch is required.
# No schedule; main-only; one serial batch, common cross-process host gate.
on:
  workflow_dispatch:
    inputs:
      mps_target:
        description: Explicit Hanoi calendar endpoint for MPS (YYYY-MM-DD)
        required: true
      moit_target:
        description: Explicit Hanoi calendar endpoint for both MOIT families (YYYY-MM-DD)
        required: true
      lookback:
        description: Prior calendar dates included (0 means endpoint only)
        type: choice
        options: ['0', '6']
        default: '0'
      cap:
        description: Article cap per source; overflow refuses the window without sampling
        type: choice
        options: ['2', '40']
        default: '2'

concurrency:
  group: vietnam-ministry-shadow
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  shadow:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install -r repo/requirements.txt
      - name: Prepare isolated state checkouts
        env:
          STATE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/vn-ministry-state"
          for pair in \
            vn_mps_foreign_affairs_vi:shadow/vietnam-mps-foreign-affairs \
            vn_moit_energy_vi:shadow/vietnam-moit-energy \
            vn_moit_foundational_industry_vi:shadow/vietnam-moit-foundational-industry; do
            slug=${pair%%:*}
            branch=${pair#*:}
            dest="${RUNNER_TEMP}/vn-ministry-state/${slug}"
            status=0
            git ls-remote --exit-code --heads "$STATE_REMOTE" "refs/heads/${branch}" > "${RUNNER_TEMP}/${slug}-head" || status=$?
            if [ "$status" -eq 0 ]; then
              git clone --branch "$branch" --single-branch "$STATE_REMOTE" "$dest"
            elif [ "$status" -eq 2 ]; then
              git init "$dest"
              git -C "$dest" checkout --orphan "$branch"
              git -C "$dest" remote add origin "$STATE_REMOTE"
            else
              exit "$status"
            fi
          done
      - name: Collect serial bounded batch
        working-directory: repo
        env:
          MPS_TARGET: ${{ inputs.mps_target }}
          MOIT_TARGET: ${{ inputs.moit_target }}
          LOOKBACK: ${{ inputs.lookback }}
          CAP: ${{ inputs.cap }}
        run: |
          set -euo pipefail
          python scripts/vietnam_ministry_remote.py \
            --root "${RUNNER_TEMP}/vn-ministry-state" \
            --gate-dir "${RUNNER_TEMP}/vn-ministry-host-gate" \
            --mps-target "$MPS_TARGET" --moit-target "$MOIT_TARGET" \
            --lookback "$LOOKBACK" --cap "$CAP" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --commit "$(git rev-parse HEAD)" 2>&1 | tee "${RUNNER_TEMP}/vn-ministry-run.log"
      - name: Assert collector checkout preservation
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Publish successful state only
        if: success()
        run: |
          set -euo pipefail
          collector=$(git -C "${GITHUB_WORKSPACE}/repo" rev-parse HEAD)
          for slug in vn_mps_foreign_affairs_vi vn_moit_energy_vi vn_moit_foundational_industry_vi; do
            dest="${RUNNER_TEMP}/vn-ministry-state/${slug}"
            branch=$(git -C "$dest" branch --show-current)
            case "$branch" in
              shadow/vietnam-mps-foreign-affairs|shadow/vietnam-moit-energy|shadow/vietnam-moit-foundational-industry) ;;
              *) exit 1 ;;
            esac
            git -C "$dest" config user.name 'github-actions[bot]'
            git -C "$dest" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$dest" add state
            git -C "$dest" commit -m "shadow(${slug}): run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              -m "Collector ${collector}. Successful state only; never merged to main."
            git -C "$dest" push origin "HEAD:refs/heads/${branch}"
          done
      - name: Preserve complete attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietnam-ministry-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vn-ministry-state/vn_mps_foreign_affairs_vi/state/
            ${{ runner.temp }}/vn-ministry-state/vn_moit_energy_vi/state/
            ${{ runner.temp }}/vn-ministry-state/vn_moit_foundational_industry_vi/state/
            ${{ runner.temp }}/vn-ministry-run.log
          if-no-files-found: warn
          retention-days: 90

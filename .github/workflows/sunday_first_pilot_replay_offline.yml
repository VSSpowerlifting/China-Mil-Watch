name: Sunday first-edition reviewed-file replay — offline safety

on:
  pull_request:
    branches: [main, feat/sunday-editor-readable-email-20261010]
    paths:
      - "scripts/sunday_first_pilot_reviewed_replay.py"
      - "tests/test_sunday_first_pilot_reviewed_replay.py"
      - ".github/workflows/sunday_first_pilot_replay_offline.yml"

permissions:
  contents: read

jobs:
  private-replay-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt
      - name: Test original-byte SHA, wrong-week, no-model, no-send and SMTP mocks
        run: python -m unittest tests.test_sunday_first_pilot_reviewed_replay tests.test_sunday_editor_readable tests.test_sunday_pilot_owner_release -v
      - name: Confirm tracked database and production outputs untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

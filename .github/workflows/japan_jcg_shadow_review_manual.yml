name: Japan Coast Guard — Pinned Shadow Review (Read Only)

# No schedule, no collector or production promotion. Owner invokes after
# a verified immutable shadow state commit exists.
on:
  workflow_dispatch:
    inputs:
      state_commit:
        description: Exact full 40-character commit on shadow/japan-jcg
        required: true
        type: string
      as_of:
        description: Review cutoff UTC date YYYY-MM-DD
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: japan-jcg-pinned-review
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: repo
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install already declared dependencies
        run: pip install -r repo/requirements.txt

      - name: Verify exact SHA and ISO date; fail closed before clone
        env:
          REVIEW_STATE_COMMIT: ${{ inputs.state_commit }}
          REVIEW_AS_OF: ${{ inputs.as_of }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEW_STATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$REVIEW_AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
          python - <<'PY'
          import os
          from datetime import date
          day = os.environ["REVIEW_AS_OF"]
          assert date.fromisoformat(day).isoformat() == day
          PY

      - name: Clone isolated state branch read only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c credential.helper= clone \
            --single-branch --branch shadow/japan-jcg \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$RUNNER_TEMP/japan-jcg-state"
          test "$(git -C "$RUNNER_TEMP/japan-jcg-state" branch --show-current)" = shadow/japan-jcg

      - name: Export pinned state and produce unapproved review
        env:
          REVIEW_STATE_COMMIT: ${{ inputs.state_commit }}
          REVIEW_AS_OF: ${{ inputs.as_of }}
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/japan-jcg-pinned-review"
          mkdir -p "$out"
          rc=0
          python scripts/review_desk_shadow.py \
            --desk japan_jcg \
            --state-repo "$RUNNER_TEMP/japan-jcg-state" \
            --state-commit "$REVIEW_STATE_COMMIT" \
            --as-of "$REVIEW_AS_OF" \
            --out "$out/formal" || rc=$?
          if [ -f "$out/formal/report.json" ]; then
            python scripts/japan_jcg_pinned_review_receipt.py \
              --report "$out/formal/report.json" \
              --state-commit "$REVIEW_STATE_COMMIT" \
              --as-of "$REVIEW_AS_OF" \
              --actions-run-id "$GITHUB_RUN_ID" \
              --output "$out/receipt.json"
          fi
          # A formal review that finds machine-integrity issues remains red.
          exit "$rc"

      - name: Upload review metadata only, NOT archived article text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-jcg-pinned-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/japan-jcg-pinned-review/receipt.json
            ${{ runner.temp }}/japan-jcg-pinned-review/formal/report.json
            ${{ runner.temp }}/japan-jcg-pinned-review/formal/report.md
          retention-days: 90
          if-no-files-found: warn
      # Never upload records.jsonl or original HTML/PDF capture files.
      # Never use push, create a production desk, send SMTP or mark approved.

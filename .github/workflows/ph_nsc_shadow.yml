name: Philippines NSC Shadow Collection

# Isolated prospective evaluation only. Proposed state is on shadow/ph-nsc, outside
# the collector checkout. No production collection, analysis or deployment.
# This repository is public: its state branch is not confidential storage.
# Activation awaits the owner's scheduled-identity decision; retain the
# adapter's ChinaMilWatch-ShadowCollector/0.1 identity without alteration.

on:
  schedule:
    # 10:10 UTC, between US shadow (08:40) and the daily window (12:23).
    - cron: '10 10 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: >-
          Logical UTC date, YYYY-MM-DD. Leave empty for today's UTC date.
          To recover a failed scheduled run, name its intended logical date.
          A UI re-run without an explicit date is refused.
        required: false
        default: ''

concurrency:
  group: ph-nsc-shadow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shadow:
    # Hard activation guard: both scheduled and manual jobs stay disabled.
    # Remove only in a reviewed change after identity and confidential-storage
    # decisions. The remote below is public and must not hold confidential state.
    if: ${{ false }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the collector
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r repo/requirements.txt

      - name: Check out shadow state
        env:
          STATE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          status=0
          git ls-remote --exit-code --heads "$STATE_REMOTE" refs/heads/shadow/ph-nsc \
            > "${RUNNER_TEMP}/ph-nsc-head" || status=$?
          if [ "$status" -eq 0 ]; then
            git clone --branch shadow/ph-nsc --single-branch "$STATE_REMOTE" \
              "${RUNNER_TEMP}/shadow-state"
          elif [ "$status" -eq 2 ]; then
            # Only an absent ref permits bootstrap. Network/auth failures stop.
            git init "${RUNNER_TEMP}/shadow-state"
            git -C "${RUNNER_TEMP}/shadow-state" checkout --orphan shadow/ph-nsc
            git -C "${RUNNER_TEMP}/shadow-state" remote add origin "$STATE_REMOTE"
          else
            exit "$status"
          fi

      - name: Assert the state checkout is not the repository
        run: |
          set -euo pipefail
          case "$(realpath "${RUNNER_TEMP}/shadow-state")" in
            "$(realpath "${GITHUB_WORKSPACE}/repo")"*) exit 1 ;;
          esac
          cd "${RUNNER_TEMP}/shadow-state"
          if [ "$(git branch --show-current)" != shadow/ph-nsc ]; then
            exit 1
          fi
          if git rev-parse --verify --quiet HEAD >/dev/null; then
            if git ls-tree --name-only HEAD | grep -v '^state$'; then
              echo "::error::state branch contains files outside state/"
              exit 1
            fi
          fi

      - name: Run shadow collection
        id: collect
        working-directory: repo
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          if [ -n "${TARGET_DATE:-}" ]; then
            set -- --target-date "$TARGET_DATE"
          else
            set --
          fi
          python scripts/shadow_collect_ph_nsc.py \
            --state-dir "${RUNNER_TEMP}/shadow-state/state" \
            --lookback-days 6 --cap 40 \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --commit "$(git rev-parse HEAD)" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --cron-utc "10:10" "$@" \
            2>&1 | tee "${RUNNER_TEMP}/ph-nsc-run.log"

      - name: Assert the collector left the repository untouched
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            exit 1
          fi

      - name: Assert the ledger is append-only
        if: always()
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/shadow-state"
          if git rev-parse --verify --quiet HEAD >/dev/null; then
            changed=$(git diff --name-status -- state/ledger state/clock.json | grep -E '^(M|D|R)' || true)
            if [ -n "$changed" ]; then
              echo "::error::historical ledger or clock changed"
              exit 1
            fi
          fi

      - name: Publish shadow state
        if: success()
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/shadow-state"
          if [ -e state/shadow.db-wal ] || [ -e state/shadow.db-shm ]; then
            echo "::error::refusing to commit a WAL/SHM sidecar"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            exit 0
          fi
          collector_commit=$(git -C "${GITHUB_WORKSPACE}/repo" rev-parse HEAD)
          git commit -m "shadow(ph-nsc): run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -m "Collector ${collector_commit}. State only; never merged to main."
          # A divergent writer fails here. No force push or history repair.
          git push origin shadow/ph-nsc

      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ph-nsc-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shadow-state/state/
            ${{ runner.temp }}/ph-nsc-run.log
          if-no-files-found: warn
          retention-days: 90

name: Singapore Shadow Collection

# Shadow evaluation only. This workflow collects Singapore MINDEF releases into
# an isolated state branch. It publishes nothing, deploys nothing, and never
# writes to `main`.
#
# Isolation, by construction:
#   * state lives on `shadow/singapore-mindef`, checked out into a directory
#     OUTSIDE the repository working tree; the runner refuses to write inside it
#   * `contents: write` is the only permission, and the only ref it pushes is
#     the state branch
#   * no Pages step, no call to the daily workflow, no output/ generation
#   * pushes are non-force and fail on non-fast-forward, so a divergent state
#     branch stops the run instead of being overwritten

on:
  schedule:
    # 21:10 UTC — well clear of the daily China window (12:23–14:23 UTC and its
    # observed 60–100 minute lateness), so the two never contend.
    - cron: '10 21 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: >-
          Logical collection date to record, YYYY-MM-DD in UTC. Leave empty to
          record the UTC date this dispatch runs on. Set it to recover a
          scheduled run that failed or was re-run: name the day that run was
          meant to cover. A UI re-run cannot say which day it means and is
          refused, so this input is the recovery path.
        required: false
        default: ''

concurrency:
  group: singapore-shadow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the collector
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r repo/requirements.txt

      # The state branch is checked out as a sibling of the repository, never
      # inside it. `scripts/shadow_collect.py` refuses any --state-dir under the
      # repo root, so this layout is enforced on both sides.
      - name: Check out shadow state
        run: |
          set -euo pipefail
          git clone --branch shadow/singapore-mindef --single-branch \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "${RUNNER_TEMP}/shadow-state" 2>/dev/null \
          || {
            echo "state branch absent — initialising an empty orphan"
            git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              "${RUNNER_TEMP}/shadow-state"
            cd "${RUNNER_TEMP}/shadow-state"
            git checkout --orphan shadow/singapore-mindef
            git rm -rf . >/dev/null 2>&1 || true
          }
          echo "state at ${RUNNER_TEMP}/shadow-state"

      - name: Assert the state checkout is not the repository
        run: |
          set -euo pipefail
          case "${RUNNER_TEMP}/shadow-state" in
            "${GITHUB_WORKSPACE}"/repo*)
              echo "::error title=Isolation::shadow state resolved inside the collector checkout"
              exit 1 ;;
          esac
          echo "Shadow state is outside the collector checkout."

      - name: Run shadow collection
        id: collect
        working-directory: repo
        env:
          # Through the environment, never interpolated into the script body.
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          # An absent or empty dispatch input must not reach argparse as an
          # empty --target-date: "" is not a date, and a refusal here would be
          # a refusal of every scheduled run. Build the argument only when the
          # operator actually named a day.
          if [ -n "${TARGET_DATE:-}" ]; then
            set -- --target-date "${TARGET_DATE}"
          else
            set --
          fi
          # --event-name / --cron-utc give the collector the LOGICAL date of
          # the nominal 21:10 UTC slot. Actions starts scheduled jobs late —
          # observed hours late here — and a run that crosses UTC midnight was
          # previously stamped with the following day, leaving its own day with
          # no ledger. Keep --cron-utc equal to the cron above.
          python scripts/shadow_collect.py \
            --state-dir "${RUNNER_TEMP}/shadow-state/state" \
            --lookback-days 30 \
            --cap 40 \
            --run-id "${GITHUB_RUN_ID}" \
            --commit "${GITHUB_SHA}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --cron-utc "21:10" \
            "$@"

      # Only reached when collection succeeded: a failing run must not persist a
      # half-written state, and `set -e` above already stopped the job.
      - name: Publish shadow state
        if: success()
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/shadow-state"
          if [ -e state/shadow.db-wal ] || [ -e state/shadow.db-shm ]; then
            echo "::error title=Sidecar::refusing to commit a WAL/SHM sidecar"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "No shadow state change to record."
            exit 0
          fi
          git commit \
            -m "shadow(singapore): run ${GITHUB_RUN_ID}" \
            -m "Recorded by ${GITHUB_WORKFLOW} at ${GITHUB_SHA}." \
            -m "State only. Never merged to main."
          git push origin shadow/singapore-mindef

      - name: Upload the run ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singapore-shadow-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}/shadow-state/state/ledger/
          if-no-files-found: warn
          retention-days: 90

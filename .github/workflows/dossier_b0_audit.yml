name: Dossier B0 preserved-record discovery audit

on:
  push:
    branches:
      - research/dossier-pilot-audit-20261009
    paths:
      - scripts/audit_dossier_candidates.py
      - tests/test_dossier_candidate_audit.py
      - .github/workflows/dossier_b0_audit.yml

permissions:
  contents: read

concurrency:
  group: dossier-b0-audit-branch
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read tracked archive at exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record archive and public-output baselines
        shell: bash
        run: |
          sha256sum pla_watch.db > /tmp/dossier-b0-db.sha
          git status --porcelain --untracked-files=all -- pla_watch.db output/ > /tmp/dossier-b0-before.txt
      - name: Compile bounded audit script
        run: python -m py_compile scripts/audit_dossier_candidates.py
      - name: Test discovery hard negatives
        run: python -m unittest tests.test_dossier_candidate_audit -v
      - name: Execute read-only discovery and show metadata report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_dossier_candidates.py --max-examples 10 | tee /tmp/dossier-b0-report.md
          test -s /tmp/dossier-b0-report.md
      - name: Confirm no production archive/output mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/dossier-b0-db.sha
          git diff --exit-code -- pla_watch.db output/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
          diff -u /tmp/dossier-b0-before.txt <(git status --porcelain --untracked-files=all -- pla_watch.db output/)
          echo "DB and output unchanged; no WAL/SHM sidecars"

name: Regional typed Japan/Vietnam metadata hold checks

on:
  pull_request:
    branches:
      - main
    paths:
      - core/regional_typed_research_holds.py
      - scripts/regional_typed_research_holds.py
      - tests/test_regional_typed_research_holds.py
      - docs/REGIONAL_TYPED_RESEARCH_HOLDS.md
      - .github/workflows/regional_typed_research_hold_checks.yml

permissions:
  contents: read

concurrency:
  group: typed-regional-holds-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-holds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted tokens
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Baseline tracked archive
        id: base
        run: echo "hash=$(sha256sum pla_watch.db | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regional and Sunday typed-source contracts offline
        run: |
          python -m unittest -v \
            tests.test_regional_weekly_inventory \
            tests.test_briefs_editorial_evidence \
            tests.test_regional_typed_research_holds \
            tests.test_sunday_japan_offer_gate \
            tests.test_vietnam_sunday_roster_attestation
      - name: Confirm no model, mail, scheduled or publishing path
        run: |
          python - <<'PY'
          from pathlib import Path
          core = Path("core/regional_typed_research_holds.py").read_text()
          cli = Path("scripts/regional_typed_research_holds.py").read_text()
          wf = Path(".github/workflows/regional_typed_research_hold_checks.yml").read_text()
          assert "ANTHROPIC" not in core + cli
          assert "smtplib" not in core + cli
          assert "send_packet(" not in core + cli
          assert "  " + "schedule:" not in wf
          assert "actions/" + "upload-artifact" not in wf
          assert "model_input_authorized\": False" in core
          assert "O_EXCL" in cli
          print("No AI, SMTP, schedule or output artifact")
          PY
      - name: Preserve tracked database and rendered site
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$(sha256sum pla_watch.db | cut -d' ' -f1)" = "${{ steps.base.outputs.hash }}"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

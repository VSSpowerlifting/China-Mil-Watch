name: Japan official MOD two-HTML metadata observation contracts

on:
  pull_request:
    branches: [main]
    paths:
      - core/japan_mod_html_observation.py
      - scripts/japan_mod_html_observation.py
      - tests/test_japan_mod_html_observation.py
      - docs/JAPAN_MOD_HTML_OBSERVATION.md
      - .github/workflows/japan_mod_html_observation_checks.yml

permissions:
  contents: read

concurrency:
  group: mod-html-observation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Baseline tracked archive
        id: baseline
        run: echo "sha=$(sha256sum pla_watch.db | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt
      - name: Run exact MOD source allowlist, HTML and scope tests
        run: |
          python -m unittest -v \
            tests.test_japan_mod_html_observation \
            tests.test_japan_sunday_source_attestation \
            tests.test_regional_typed_human_review_prep
      - name: Explicitly no scheduled publisher fetch, model or email
        run: |
          python - <<'PY'
          from pathlib import Path
          a = Path("core/japan_mod_html_observation.py").read_text()
          b = Path("scripts/japan_mod_html_observation.py").read_text()
          w = Path(".github/workflows/japan_mod_html_observation_checks.yml").read_text()
          assert "ANTHROPIC_API_KEY" not in a+b
          assert "smtplib" not in a+b
          assert "send_packet(" not in a+b
          assert "  " + "schedule:" not in w
          assert "actions/" + "upload-artifact" not in w
          assert '"publication_authorized": False' in a
          assert '"model_input_authorized": False' in a
          assert "--fetch-live" in b
          assert "O_EXCL" in b
          print("No live publisher GET in CI; manual no-use observation only")
          PY
      - name: Preserve production database and published output
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$(sha256sum pla_watch.db | cut -d' ' -f1)" = "${{ steps.baseline.outputs.sha }}"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

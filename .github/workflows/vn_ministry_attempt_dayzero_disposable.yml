# Disposable focused check for historical Day 0 compatibility; REMOVE after run.
name: Vietnam ministry bootstrap compatibility check
on:
  push:
    branches:
      - feat/vietnam-ministry-attempt-reconciliation-20261008
permissions:
  contents: read
jobs:
  synthetic:
    if: ${{ github.event.head_commit.message == 'Run corrected Day 0 ministry reconciliation tests' && github.ref == 'refs/heads/feat/vietnam-ministry-attempt-reconciliation-20261008' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify complete Day 0 and daily receipts
        run: python -m unittest tests.test_vietnam_ministry_attempt_reconciliation -v

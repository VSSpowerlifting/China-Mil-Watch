name: One-time B1.1 hardening smoke

on:
  push:
    branches:
      - feat/dossier-v1-pure-contract-20261009
    paths:
      - .github/workflows/dossier_contract_hardening_temp.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m py_compile core/dossier_contract.py tests/test_dossier_contract.py
      - run: python -m unittest tests.test_dossier_contract -v
      - name: Preserve current production files
        run: |
          git diff --exit-code -- pla_watch.db output/ briefs/ timelines/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

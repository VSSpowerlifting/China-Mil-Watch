name: Korea Signed Metadata — Disposable SQLite Rehearsal

on:
  pull_request:
    paths:
      - scripts/rehearse_korea_metadata_sqlite.py
      - tests/test_korea_metadata_sqlite_rehearsal.py
      - .github/workflows/korea_metadata_disposable_rehearsal.yml
      - docs/engineering/KOREA_METADATA_SQLITE_IMPORT_REHEARSAL_2026-10-15.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scratch-only-korea:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install existing shadow HWPX parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise synthetic signed review and disposable SQLite boundaries
        run: |
          python -m unittest tests.test_korea_versioned_review_admission tests.test_korea_metadata_sqlite_rehearsal -v
      - name: Assert no production database or website mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ desks/registry.json
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

# Never uses real reviewer keys, real Korea source originals, source copies,
# provider network, model, SMTP, production database or public GitHub Pages.

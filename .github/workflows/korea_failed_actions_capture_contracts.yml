name: Korea Failed Actions Artifact — Offline Capture Reconciliation

# Synthetic-only ZIP fixtures, no real Korea original downloads/artifacts.
# The operational auditor must be run explicitly, locally and privately.
on:
  pull_request:
    paths:
      - scripts/audit_korea_failed_action_captures.py
      - tests/test_korea_failed_action_captures.py
      - .github/workflows/korea_failed_actions_capture_contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-artifact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run ZIP safety, SHA-256, source-version, failed-only checks
        run: python -m unittest tests.test_korea_failed_action_captures -v
      - name: Confirm production and shadow output not changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ shadow/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

# No GitHub artifact downloads, original Korean bytes, model, publishing,
# credentials, email, real private transfer, shadow writes or production admission.

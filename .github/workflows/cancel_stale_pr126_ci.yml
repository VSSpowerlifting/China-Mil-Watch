name: Cancel stale PR126 CI

on:
  push:
    branches:
      - ops/cancel-stale-pr126-ci

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=37706625266
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          status="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          echo "stale PR run: ${status}"
          if [ "${status}" != "completed" ]; then
            code="$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}/cancel")"
            if [ "${code}" != "202" ] && [ "${code}" != "409" ]; then
              cat /tmp/cancel.json
              exit 1
            fi
          fi

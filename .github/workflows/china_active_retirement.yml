name: China active corpus retirement — scratch-only contracts

on:
  pull_request:
    paths:
      - "scripts/plan_china_active_retirement.py"
      - "tests/test_china_active_retirement.py"
      - "docs/CHINA_ACTIVE_CORPUS_RETIREMENT_2026-10-15.md"
      - ".github/workflows/china_active_retirement.yml"

permissions:
  contents: read

jobs:
  scratch-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Fingerprint tracked SQLite and publication artifacts
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > "$RUNNER_TEMP/db.sha"
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
      - name: Exercise transactional scratch deletion and negative cases
        run: python -m unittest -v tests.test_china_active_retirement
      - name: Fail closed if any production files changed
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/db.sha"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

  live-corpus-cohort-rehearsal:
    # This is a stacked PR whose base is #663, created before the main-branch
    # 600-record focus renderer in #636 merged. It cannot compute focus_ids
    # until retargeted to main after #657/#663. Do not report a skipped job
    # as live-corpus or full-site release verification.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - name: Fingerprint canonical tracked corpus
        run: |
          set -euo pipefail
          sha256sum pla_watch.db > "$RUNNER_TEMP/source-db.sha"
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
      - name: Install site renderer dependencies
        run: pip install -r requirements.txt
      - name: Generate a temporary focus index without modifying public output
        run: |
          python site/render.py \
            --out "$RUNNER_TEMP/china-retirement-focus-site" \
            --site-origin https://indopacificrecord.org
      - name: Calculate exact 4300–4500 candidate from generated focus and editorial dependencies
        run: |
          set -euo pipefail
          python -m scripts.plan_china_active_retirement \
            --index "$RUNNER_TEMP/china-retirement-focus-site/corpus-index.json" \
            > "$RUNNER_TEMP/china-retirement-summary.json"
          python - "$RUNNER_TEMP/china-retirement-summary.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          assert 4300 <= d["china_to_retire"] <= 4500
          assert d["automated_china_focus"] == 600
          assert d["other_desks_before"] > 0
          assert d["total_after"] == d["total_before"] - d["china_to_retire"]
          print(json.dumps({k:v for k,v in d.items()
                            if k in ("total_before","china_before",
                                     "other_desks_before","china_to_retire",
                                     "china_after","total_after",
                                     "published_trail_references",
                                     "bound_brief_and_timeline_ids",
                                     "supplemental_automated_context",
                                     "retirement_id_sha256")},
                           indent=2,sort_keys=True))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as w:
              w.write("## China: current corpus retirement rehearsal\\n\\n")
              for field in ("total_before","china_before","other_desks_before",
                            "china_to_retire","china_after","total_after",
                            "published_trail_references",
                            "bound_brief_and_timeline_ids",
                            "supplemental_automated_context",
                            "retirement_id_sha256"):
                  w.write("- **%s:** %s\\n" % (field,d[field]))
          PY
      - name: Physically retire 4400 China articles in a new scratch SQLite file
        run: |
          set -euo pipefail
          python -m scripts.plan_china_active_retirement \
            --index "$RUNNER_TEMP/china-retirement-focus-site/corpus-index.json" \
            --scratch-db "$RUNNER_TEMP/china-retired-scratch.db" \
            --tombstones-out "$RUNNER_TEMP/china-retired-url-hashes.json" \
            > "$RUNNER_TEMP/china-retirement-atomic-result.json"
          python - "$RUNNER_TEMP/china-retirement-atomic-result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          r=d["rehearsal"]
          assert r["retired"] == d["china_to_retire"] == 4400
          assert r["kept"] == d["total_after"]
          assert r["atomic_retirement"] is True
          assert r["url_tombstone_count"] == r["retired"]
          assert r["production_db_modified"] is False
          print("Physical scratch deletion and permanent URL ledger:",r["retired"])
          PY
      - name: Render reduced archive from disposable database, then verify exact retained identities
        run: |
          set -euo pipefail
          python site/render.py \
            --db "$RUNNER_TEMP/china-retired-scratch.db" \
            --out "$RUNNER_TEMP/china-retirement-reduced-site" \
            --site-origin https://indopacificrecord.org
          python - "$RUNNER_TEMP/china-retirement-focus-site" "$RUNNER_TEMP/china-retirement-reduced-site" <<'PY'
          import json, pathlib, sys
          before, after = [pathlib.Path(s) for s in sys.argv[1:]]
          old=json.loads((before/"corpus-index.json").read_text())
          new=json.loads((after/"corpus-index.json").read_text())
          old_ids={r[0] for r in old["records"]}
          new_ids={r[0] for r in new["records"]}
          gone=old_ids-new_ids
          assert len(gone)==4400
          assert len(new_ids)==873
          assert not new_ids-old_ids
          assert set(old["trail_ids"]).issubset(new_ids)
          assert set(old["focus_ids"]).issubset(new_ids)
          assert len(set(new["focus_ids"]))==len(set(old["focus_ids"]))
          for ident in list(gone)[:20]:
              assert not (after/"record"/("%d.html"%ident)).exists()
          for ident in list(old["trail_ids"])[:20]:
              assert (after/"record"/("%d.html"%ident)).is_file()
          print("Reduced site identities:",len(new_ids),
                "retired:",len(gone),
                "preserved citation IDs:",len(old["trail_ids"]))
          PY
      - name: Carry original published editorial issues and media after fresh render
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/china-retirement-reduced-site" <<'PY'
          from pathlib import Path
          import shutil,sys,importlib.util
          spec=importlib.util.spec_from_file_location("ipr_render",Path("site/render.py").resolve())
          site_render=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(site_render)
          target=Path(sys.argv[1])
          old=Path("output")
          for name in site_render.CARRIED_FORWARD:
              src=old/name
              dst=target/name
              if not src.exists():
                  continue
              if src.is_dir():
                  for file in src.rglob("*"):
                      if file.is_file():
                          candidate=dst/file.relative_to(src)
                          if not candidate.exists():
                              candidate.parent.mkdir(parents=True,exist_ok=True)
                              shutil.copy2(file,candidate)
              elif not dst.exists():
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(src,dst)
          # Never carry the old articles.json; it still advertises retired IDs.
          (target/"data"/"articles.json").unlink(missing_ok=True)
          print("Carried preserved publication files and assets; sitemap entries:",
                site_render.add_carried_pages_to_sitemap(target))
          PY
      - name: Regenerate legacy JSON export from retained DB, never publish obsolete entries
        run: |
          set -euo pipefail
          python -m scripts.build_retired_archive_export \
            --db "$RUNNER_TEMP/china-retired-scratch.db" \
            --site "$RUNNER_TEMP/china-retirement-reduced-site"
          test -s "$RUNNER_TEMP/china-retirement-reduced-site/data/articles.json"
      - name: Run entire reduced site output validator
        run: python scripts/validate_output.py "$RUNNER_TEMP/china-retirement-reduced-site"
      - name: Verify canonical DB and output were never modified
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/source-db.sha"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

name: Translation tool value validation contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/analyzer.py'
      - 'tests/test_translation_tool_value_validation.py'
      - 'docs/TRANSLATION_TOOL_VALUE_VALIDATION.md'
      - '.github/workflows/translation_tool_value_contracts.yml'

permissions:
  contents: read

jobs:
  offline-translation-values:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Record archive/output identity
        run: |
          sha256sum pla_watch.db > "$RUNNER_TEMP/unchanged-db.sha256"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Install declared dependencies
        run: pip install -r requirements.txt
      - name: Prove invalid translation payloads cannot become successful analyses
        env:
          ANTHROPIC_API_KEY: ''
        run: |
          python -m unittest tests.test_translation_tool_value_validation -v
          python -m unittest tests.test_llm_usage_telemetry -v
      - name: Cross-check recurring October translation failures against stored blank-body flags
        run: |
          set -euo pipefail
          python scripts/audit_analysis_failure_causes.py --db pla_watch.db \
            > "$RUNNER_TEMP/translation-review-metadata.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "translation-review-metadata.json").read_text())
          assert report["model_calls"] == 0 and report["writes"] == 0
          assert report["root_causes_established"] is False
          assert report["model_spend_authorized"] is False
          blank = {r["article_id"] for r in
                   report["samples_by_flag"]["daily_blank_body"]}
          # These IDs appeared in both Oct 6 and Oct 8 Daily log receipts,
          # not directly in the run-level cost ledger.
          for ident in (1856, 1857, 1944):
              print("Previously repeated translation-failure article=%d "
                    "currently_in_blank_body_audit_sample=%s" %
                    (ident, ident in blank))
          print("All stored Daily blank-body flags=%d; sample_size=%d" %
                (report["totals"]["daily_blank_body"], len(blank)))
          PY
      - name: Prove site and tracked archive have not changed
        run: |
          sha256sum -c "$RUNNER_TEMP/unchanged-db.sha256"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

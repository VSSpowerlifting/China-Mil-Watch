name: Desks Phase 4A — guarded frontend release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/desks_p4a_render_only_release.yml'
      - 'scripts/stage_desks_p4a_output.py'
      - 'scripts/guard_desks_p4a_output_scope.py'
      - 'tests/test_desks_p4a_release_contract.py'
  workflow_dispatch:
    inputs:
      approved_main_sha:
        description: "Exact 40-character main commit approved for Phase 4A Desks publication"
        required: true
        type: string
      publish:
        description: "Commit reviewed Desks output and deploy GitHub Pages (otherwise preview)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - name: Install existing build dependencies
        run: pip install -r requirements.txt
      - name: Test exact release paths and provenance
        run: python -m unittest tests.test_desks_p4a_release_contract -v
      - name: Rehearse isolated Desks build and stage with no publication
        run: |
          set -euo pipefail
          test ! -e pla_watch.db-wal && test ! -e pla_watch.db-shm
          db_before="$(sha256sum pla_watch.db | cut -d' ' -f1)"
          python site/render.py --out "$RUNNER_TEMP/desks-render"
          python -m scripts.stage_desks_p4a_output --from-dir "$RUNNER_TEMP/desks-render" --to-dir output
          python scripts/validate_output.py
          python -m scripts.guard_desks_p4a_output_scope
          test "$db_before" = "$(sha256sum pla_watch.db | cut -d' ' -f1)"
          test ! -e pla_watch.db-wal && test ! -e pla_watch.db-shm
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^([AMDRC ][AMDRC ]|[?][?]) output/' || true)"
      - name: Preview rendered Desks routes and flags
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desks-p4a-staged-preview
          path: |
            output/desks.html
            output/desk-map.css
            output/assets/flags/*.svg
            output/assets/flags/LICENSE
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: daily-update
      cancel-in-progress: false
    steps:
      - name: Check out exact current main with write access
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Fail closed if owner-reviewed SHA is stale
        env:
          EXPECTED_SHA: ${{ inputs.approved_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Provide full main SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "::error::Main changed after owner review"; exit 1;
          }
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e pla_watch.db-wal && test ! -e pla_watch.db-shm
          sha256sum pla_watch.db > "$RUNNER_TEMP/desks-db.sha"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - name: Install existing render dependencies
        run: pip install -r requirements.txt
      - name: Verify release contract and build in isolation
        run: |
          set -euo pipefail
          python -m unittest tests.test_desks_p4a_release_contract -v
          python site/render.py --out "$RUNNER_TEMP/desks-render"
          python -m scripts.stage_desks_p4a_output --from-dir "$RUNNER_TEMP/desks-render" --to-dir output
          python scripts/validate_output.py
          python -m scripts.guard_desks_p4a_output_scope
          sha256sum -c "$RUNNER_TEMP/desks-db.sha"
          test ! -e pla_watch.db-wal && test ! -e pla_watch.db-shm
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^([AMDRC ][AMDRC ]|[?][?]) output/' || true)"
      - name: Upload reviewed Desks-only render preview
        uses: actions/upload-artifact@v4
        with:
          name: desks-p4a-staged-preview
          path: |
            output/desks.html
            output/desk-map.css
            output/assets/flags/*.svg
            output/assets/flags/LICENSE
          retention-days: 7
      - name: Commit only reviewed routes on explicit publish
        if: inputs.publish
        run: |
          set -euo pipefail
          git add -A -- output/desks.html output/desk-map.css output/assets/flags
          python -m scripts.guard_desks_p4a_output_scope
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --name-only)"
          sha256sum -c "$RUNNER_TEMP/desks-db.sha"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" || {
            echo "::error::Main moved during render; preview again at the new SHA"; exit 1;
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Site: publish reviewed Phase 4A Desks map only"
          git push origin HEAD:main
      - name: Publish reviewed output to GitHub Pages
        if: inputs.publish
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          cname: indopacificrecord.org
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy reviewed Desks P4A: ${{ github.run_id }}'

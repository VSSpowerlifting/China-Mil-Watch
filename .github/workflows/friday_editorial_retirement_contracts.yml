name: Friday Briefs Retirement — Offline Safety Tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/weekly_briefs_editorial_handoff.yml
      - .github/workflows/friday_editorial_retirement_contracts.yml
      - tests/test_friday_editorial_retirement.py

permissions:
  contents: read

jobs:
  no-friday-cron:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test schedule removal and explicit manual delivery authority
        run: python -m unittest tests.test_friday_editorial_retirement -v
      - name: Assert no tracked database or renderer changes
        run: test -z "$(git status --porcelain)"

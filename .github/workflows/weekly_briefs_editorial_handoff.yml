name: Weekly IPR Briefs Editorial Handoff

on:
  schedule:
    # Sunday after the Saturday editorial week has completely closed.
    - cron: '17 15 * * 0'
  workflow_dispatch:
    inputs:
      send_email:
        description: "Actually email the worksheet (otherwise prepare only)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ipr-weekly-editorial-handoff
  cancel-in-progress: false

jobs:
  editor-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up production Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve last complete Saturday and actual live desks
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from core.brief_contract import eligible_desks
          from core.desk_registry import load_registry

          today = datetime.now(ZoneInfo("America/New_York")).date()
          elapsed = (today.weekday() - 5) % 7
          if elapsed == 0:
              elapsed = 7  # Never treat an in-progress Saturday as a full week.
          last_saturday = today - timedelta(days=elapsed)
          desks = eligible_desks(load_registry())
          if len(desks) < 2:
              raise SystemExit("Refusing editorial dispatch: fewer than two production desks")
          print("IPR_EDITOR_WEEK_END=" + last_saturday.isoformat())
          print("IPR_EDITOR_DESKS=" + ",".join(desks))
          PY

      - name: Create read-only-source unnumbered scaffold
        run: |
          python scripts/author_brief.py scaffold \
            --desks "$IPR_EDITOR_DESKS" \
            --week-ending "$IPR_EDITOR_WEEK_END" \
            --out "$RUNNER_TEMP/ipr-editorial-scaffold.json"

      - name: Build and optionally email worksheet
        env:
          SHOULD_SEND: ${{ (github.event_name == 'schedule' && vars.IPR_EDITOR_DELIVERY_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.send_email == true) }}
          IPR_EDITOR_TO: ${{ secrets.IPR_EDITOR_TO }}
          IPR_SMTP_USER: ${{ secrets.IPR_SMTP_USER }}
          IPR_SMTP_APP_PASSWORD: ${{ secrets.IPR_SMTP_APP_PASSWORD }}
        shell: bash
        run: |
          args=(--sidecar "$RUNNER_TEMP/ipr-editorial-scaffold.json"
                --out "$RUNNER_TEMP/IPR-Briefs-Editorial-$IPR_EDITOR_WEEK_END.txt")
          if [[ "$SHOULD_SEND" == "true" ]]; then
            args+=(--send)
          fi
          python scripts/weekly_editorial_handoff.py "${args[@]}"

      # Do not upload unpublished drafts as artifacts in the public repository.
      # This workflow never pushes, opens a PR, assigns a number or deploys.

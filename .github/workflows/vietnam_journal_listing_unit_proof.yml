name: Vietnam Journal Listing Offline Unit Proof

# Disposable regression run; branch never merged. No network beyond checkout.
on:
  pull_request:
    paths:
      - '.github/workflows/vietnam_journal_listing_unit_proof.yml'

permissions:
  contents: read

jobs:
  unit:
    if: ${{ github.head_ref == 'research/vietnam-journal-listing-test-20261007' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact unit proof head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install parser dependencies only
        run: python -m pip install 'beautifulsoup4>=4.12,<5'

      - name: Run source, article, and listing parser contracts
        run: |
          python -m unittest tests.test_vn_defence_journal tests.test_vn_journal_article tests.test_vn_journal_listing -v

name: Sunday editor-readable manuscript — offline presentation QA

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/sunday_editorial_handoff.py"
      - "scripts/sunday_editor_readable.py"
      - "tests/test_sunday_editor_readable.py"
      - ".github/workflows/sunday_editor_readable_offline.yml"

permissions:
  contents: read

jobs:
  presentation-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with no persistence of credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install existing offline test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify source packet boundaries and mocked-SMTP delivery
        run: python -m unittest tests.test_sunday_editor_readable -v
      - name: Confirm corpus and generated output untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

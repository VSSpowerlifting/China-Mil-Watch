name: Vietnam MPS Review Queue One-shot Proof

# Disposable read-only evidence run. Never merge this workflow to main.
# Its metadata-only packet is for the human review; no record approval,
# production/shadow writes, remote collector dispatch, or source HTTP requests.
on:
  pull_request:
    paths:
      - '.github/workflows/vietnam_mps_review_proof.yml'

permissions:
  contents: read

jobs:
  proof:
    if: ${{ github.head_ref == 'research/vietnam-mps-review-proof-20261007' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install offline evidence dependencies
        run: pip install -r requirements.txt

      - name: Check review queue regression contracts
        run: |
          python -m unittest tests.test_vietnam_mps_pilot tests.test_vietnam_mps_review_queue -v

      - name: Clone pinned MPS shadow state, read-only
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch shadow/vietnam-mps-foreign-affairs \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "${RUNNER_TEMP}/mps-state"
          test "$(git -C "${RUNNER_TEMP}/mps-state" branch --show-current)" = "shadow/vietnam-mps-foreign-affairs"
          test "$(git -C "${RUNNER_TEMP}/mps-state" ls-tree --name-only HEAD)" = "state"
          test -f "${RUNNER_TEMP}/mps-state/state/clock.json"
          git -C "${RUNNER_TEMP}/mps-state" rev-parse HEAD > "${RUNNER_TEMP}/mps-commit"

      - name: Generate unsigned metadata-only record review packet
        env:
          OUT: ${{ runner.temp }}/mps-review-queue
        run: |
          set -euo pipefail
          python scripts/prepare_vietnam_mps_review_queue.py \
            --state-repo "${RUNNER_TEMP}/mps-state" \
            --state-commit "$(cat "${RUNNER_TEMP}/mps-commit")" \
            --out-dir "$OUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["OUT"])
          q = json.loads((p / "review_queue.json").read_text())
          a = json.loads((p / "approval_template.json").read_text())
          assert a["reviewer"] is None and a["records"] == []
          assert q["human_approvals"] == q["rights_approvals"] == 0
          assert not q["original_article_bodies_in_packet"]
          assert len(q["state_commit"]) == 40
          print("verified state commit:", q["state_commit"])
          print("record count:", q["record_count"])
          print("machine review candidates:", q["machine_review_candidate_count"])
          print("machine holds:", q["machine_hold_count"])
          print("queue SHA-256:", q["queue_sha256"])
          for rec in q["records"]:
              print("record", rec["source_identity"],
                    "machine_candidate", rec["machine_review_candidate"],
                    "machine_blockers", rec["machine_blockers"])
          PY

      - name: Preserve review metadata, no raw captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietnam-mps-unsigned-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/mps-review-queue/
          if-no-files-found: warn
          retention-days: 30

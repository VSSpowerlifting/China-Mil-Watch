name: One-time Dossier B1.2 synthetic source check

on:
  push:
    branches:
      - feat/dossier-v1-synthetic-source-parity-20261009
    paths:
      - .github/workflows/dossier_source_parity_temp.yml

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Prove input archive and published pages stable
        run: |
          sha256sum pla_watch.db > /tmp/ipr-db-before.sha
          git status --porcelain -- pla_watch.db output/ briefs/ timelines/ > /tmp/ipr-public-before.txt
      - name: Compile Dossier modules and synthetic tests
        run: python -m py_compile core/dossier_contract.py core/dossier_sources.py tests/test_dossier_contract.py tests/test_dossier_sources.py
      - name: Exercise both B1.1 and B1.2 synthetic tests
        run: python -m unittest tests.test_dossier_contract tests.test_dossier_sources -v
      - name: Verify unmodified production artifacts
        if: always()
        run: |
          sha256sum -c /tmp/ipr-db-before.sha
          git diff --exit-code -- pla_watch.db output/ briefs/ timelines/
          diff -u /tmp/ipr-public-before.txt <(git status --porcelain -- pla_watch.db output/ briefs/ timelines/)
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

name: Temporary historical Briefs photo staging (Wave 2)
on:
  push:
    branches: [editorial/briefs-photo-wave2-20261013]
    paths:
      - .github/workflows/temp_briefs_photo_wave2_stage.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image encoder and offline test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install Pillow==11.3.0
      - name: Fetch only two SHA-1-bound Commons originals and build cards
        run: python scripts/stage_briefs_photo_wave2.py
      - name: Verify both hash-gated admissions (no site release)
        run: |
          python scripts/build_catalogue_media.py --check
          python -m unittest tests.test_catalogue_media -v
      - name: Commit exactly eight provenance and image paths to this branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+41898282@users.noreply.github.com"
          git add -- site/assets/catalogue/admissions.json site/assets/editorial/manifest.json
          git add -- site/assets/editorial/rimpac-china-indonesia-2016.jpg
          git add -- site/assets/editorial/liaoning-j15-may2022.jpg
          git add -- site/assets/editorial/derivatives/rimpac-china-indonesia-2016-1600.jpg
          git add -- site/assets/editorial/derivatives/liaoning-j15-may2022-1600.jpg
          git add -- site/assets/catalogue/media/no-14-rimpac-china-indonesia-2016.jpg
          git add -- site/assets/catalogue/media/no-06-liaoning-j15-may2022.jpg
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git diff --cached --name-only | grep -Ev '^(site/assets/(editorial|catalogue)/)' && exit 1 || true
          git commit -m "Briefs: stage two SHA-1-bound historic photo originals and catalogue cards"
          git push origin HEAD:editorial/briefs-photo-wave2-20261013

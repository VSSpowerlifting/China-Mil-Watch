name: Sunday Reviewed Attachment Manual Handoff — Offline No-Send Proof

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/sunday_send_reviewed_packet.py
      - tests/test_sunday_send_reviewed_packet.py
      - docs/SUNDAY_REVIEWED_ATTACHMENT_HANDOFF.md
      - .github/workflows/sunday_reviewed_attachment_contracts.yml

permissions:
  contents: read

jobs:
  reviewed-exact-file-no-send:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install project dependencies for pure offline mocks
        run: python -m pip install -r requirements.txt
      - name: Test offline digest, byte snapshot, refusal and manual authorization
        run: python -m unittest tests.test_sunday_send_reviewed_packet -v
      - name: Verify repository corpus and published files unchanged
        run: |
          test -z "$(git status --porcelain -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      # This workflow NEVER provides SMTP credentials and never invokes --send.

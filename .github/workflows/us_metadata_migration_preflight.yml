name: U.S. Desk — Repair Schema Before Metadata Admission

on:
  pull_request:
    paths:
      - .github/workflows/uscc_verified_official_links_release.yml
      - .github/workflows/treasury_verified_official_links_release.yml
      - tests/test_us_metadata_migration_preflight.py
      - .github/workflows/us_metadata_migration_preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-archive-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Recreate observed partial schema on disposable copied DB
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest \
            tests.test_us_metadata_migration_preflight \
            tests.test_uscc_official_metadata_admission \
            tests.test_us_treasury_official_metadata_admission -v
      - name: No mutation of tracked production DB or released Pages
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ shadow/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/ shadow/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

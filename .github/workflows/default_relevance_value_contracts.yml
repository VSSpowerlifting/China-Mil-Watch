name: Default relevance JSON value contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/analyzer.py'
      - 'tests/test_relevance_json_value_validation.py'
      - 'docs/DEFAULT_RELEVANCE_VALUE_VALIDATION.md'
      - '.github/workflows/default_relevance_value_contracts.yml'

permissions:
  contents: read

jobs:
  relevance-raw-json-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Preserve tracked database hash
        run: |
          sha256sum pla_watch.db > "$RUNNER_TEMP/relevance-raw-json-db.sha256"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Install normal dependencies
        run: pip install -r requirements.txt
      - name: Validate raw JSON, tool, ledger and privacy contracts
        env:
          ANTHROPIC_API_KEY: ''
          RELEVANCE_TOOL_OUTPUT_ENABLED: '0'
        run: |
          python -m unittest tests.test_relevance_json_value_validation -v
          python -m unittest tests.test_relevance_tool_optin -v
          python -m unittest tests.test_model_parse_error_redaction -v
          python -m unittest tests.test_llm_usage_telemetry -v
          python -m unittest tests.test_analysis_failure_causes -v
      - name: Assert tracked SQLite and public output unchanged
        run: |
          sha256sum -c "$RUNNER_TEMP/relevance-raw-json-db.sha256"
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
